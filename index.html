<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Akan Yazı Editör</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yazı Editör">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#000;--s:#0f0f10;--s2:#1b1b1d;--line:rgba(255,255,255,.09);--ink:#f7f7f5;--dim:#8e8e93;--acc:#cf5238;--blue:#4378a6;--green:#3f8870;--amber:#e0a43a;--ease:cubic-bezier(.32,.72,0,1);--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s var(--ease),background .2s,color .2s}
button:active{transform:scale(.95)}
input,textarea{font:inherit;color:var(--ink);background:var(--s2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%;outline:0;transition:border-color .2s;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{border-color:rgba(207,82,56,.7)}
textarea{resize:none;min-height:96px;font-family:var(--serif);font-size:1.05rem;line-height:1.45}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
header{flex:none;padding:max(16px,env(safe-area-inset-top)) 20px 8px;display:flex;align-items:flex-end;justify-content:space-between}
header h1{font-size:1.9rem;font-weight:750;letter-spacing:-.035em;line-height:1.1}
header small{display:block;color:var(--dim);font-size:.9rem;margin-top:4px}
.pill{height:36px;padding:0 15px;border-radius:18px;background:var(--s2);font-weight:600;font-size:.92rem}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:12px 20px 130px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.view.on{opacity:1;transform:none;pointer-events:auto}
h2{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;margin:26px 0 12px}
.rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* alt çubuk */
nav{position:absolute;left:20px;right:20px;bottom:max(18px,env(safe-area-inset-bottom));height:56px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(27,27,29,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;border:1px solid var(--line);z-index:5}
nav i{position:absolute;top:5px;bottom:5px;left:5px;width:calc(33.33% - 3.3px);background:rgba(255,255,255,.1);border-radius:23px;transition:transform .4s var(--ease)}
nav button{position:relative;z-index:1;font-weight:600;font-size:.95rem;color:var(--dim)}
nav button.on{color:var(--ink)}
.fab{position:absolute;right:20px;bottom:90px;width:56px;height:56px;border-radius:50%;background:var(--acc);font-size:1.8rem;font-weight:300;z-index:4;box-shadow:0 10px 26px rgba(207,82,56,.35);transition:transform .15s var(--ease),opacity .3s}
.fab.off{opacity:0;pointer-events:none;transform:scale(.7)}
/* kart listesi */
.ci{display:block;width:100%;text-align:left;background:var(--s);border:1px solid var(--line);border-radius:20px;padding:15px 16px 14px 20px;margin-bottom:10px;position:relative;overflow:hidden}
.ci::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--acc))}
.ci small{color:var(--dim);font-size:.78rem;font-weight:600}
.ci p{font-family:var(--serif);font-size:1.02rem;line-height:1.38;margin:5px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:12px;margin-right:6px;background:var(--s2);color:var(--dim)}
.ch.l{color:#8fb4d6}.ch.r{color:#ec8a74}
/* harita */
.warn{display:flex;gap:10px;align-items:center;background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;color:var(--dim);font-size:.9rem}
.warn b{color:var(--amber);font-weight:700}
.map{position:relative}
.map svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map path{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.75;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .9s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}}
.nd{position:absolute;height:50px;border-radius:15px;background:var(--s2);border:1.5px solid var(--line);padding:6px 10px;text-align:left;overflow:hidden;animation:rise .5s var(--ease) both}
.nd b{display:block;font-size:.8rem;white-space:nowrap}
.nd span{display:block;font-size:.72rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.nd.bad{border-color:var(--amber);border-style:dashed}
.rowlbl{position:absolute;left:0;font-size:.72rem;color:var(--dim)}
/* alt sayfa */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:10}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px 20px max(30px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .45s var(--ease);z-index:11}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh b{font-size:1.25rem;letter-spacing:-.02em}
.x{width:34px;height:34px;border-radius:50%;background:var(--s2);color:var(--dim)}
label{display:block;color:var(--dim);font-size:.82rem;font-weight:600;margin:16px 0 7px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--s2);border-radius:14px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(33.33% - 2.7px);background:rgba(255,255,255,.12);border-radius:10px;transition:transform .35s var(--ease)}
.seg button{position:relative;z-index:1;height:38px;font-weight:600;font-size:.9rem;color:var(--dim)}
.seg button.on{color:var(--ink)}
.side{background:var(--s);border:1px solid var(--line);border-radius:20px;padding:4px 16px 16px;margin-top:16px}
.eff{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ef{background:var(--s2);border-radius:14px;padding:8px 4px;text-align:center}
.ef small{display:block;color:var(--dim);font-size:.7rem}
.ef b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;margin:1px 0 4px}
.ef b.p{color:#7ccf9d}.ef b.n{color:#ec8a74}
.ef button{width:30px;height:26px;border-radius:13px;background:rgba(255,255,255,.08);font-weight:700}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;height:50px;border-radius:16px;background:var(--s2);font-weight:650}
.btn.p{background:var(--acc)}
.btn.d{color:#ff5a4d}
.bad-in{border-color:#ff5a4d!important}
.prev{font-family:var(--serif);font-size:1.1rem;line-height:1.5;margin-top:10px;color:rgba(247,247,245,.9)}
/* marker: kalemle çizilmiş gibi */
mark.hl{color:var(--ink);padding:.12em 7px .1em 0;margin:0 -7px 0 0;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;--c:rgba(207,82,56,.38);background:linear-gradient(var(--c),var(--c)) no-repeat 0 0/100% 100%;box-shadow:-7px 0 0 0 var(--c);animation:wipe .75s .15s cubic-bezier(.3,.7,.2,1) backwards,hs .75s .15s linear backwards}
@keyframes wipe{from{background-size:0% 100%}}
@keyframes hs{0%{box-shadow:0 0 0 0 var(--c)}8%{box-shadow:-7px 0 0 0 var(--c)}}
/* omurga */
.beat{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.beat .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;color:transparent;font-size:.85rem;font-weight:800}
.beat.done .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.beat input{background:var(--s)}
.beat.done input{color:var(--dim);text-decoration:line-through}
.seed{display:block;width:100%;text-align:left;background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;font-family:var(--serif)}
.seed small{display:block;font-family:-apple-system,system-ui,sans-serif;color:var(--dim);font-size:.75rem;margin-top:5px}
.note{color:var(--dim);font-size:.9rem}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#000;padding:10px 18px;border-radius:20px;font-weight:650;font-size:.9rem;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><div><h1>Hikaye masası</h1><small id="sub"></small></div><button class="pill" id="ioBtn">Oyun dosyası</button></header>
  <main>
    <section class="view on" id="v0"></section>
    <section class="view" id="v1"></section>
    <section class="view" id="v2"></section>
    <button class="fab off" id="fab" aria-label="Yeni kart">+</button>
    <nav><i id="ni"></i><button class="on">Harita</button><button>Kartlar</button><button>Omurga</button></nav>
  </main>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept=".html,text/html" hidden>
</div>
<script>
var STATS={faith:'İnanç',people:'Halk',army:'Ordu',wealth:'Servet'};
var ARCS={ana:['Ana hikaye','#cf5238'],yan:['Yan görev','#4378a6'],dal:['Dal','#3f8870']};
var KEY='hikaye-masasi-v1';
function seed(){
  var T=[['q1','Uğultu',.04,'…uyan… Beni du…yu…yor musun? Gözlerini aç.','Sus','Evet'],['q2','Boğuk bir ses',.15,'Dur. Adını söyle bana.','Hatırlamıyorum','Söylemem'],['q3','Boğuk bir ses',.3,'Dün gece… neredeydin? Düşün.','Hayır','Hatırlıyorum'],['q4','Bir erkek sesi',.5,'Yanındaki adam kimdi? Bana onu anlat.','Tanımıyorum','Anlatırım'],['q5','Bir gölge',.7,'Bir şey saklıyorsun. Gözlerinden belli.','Saklamıyorum','Saklıyorum'],['q6','???',.88,'Bana bak. Şimdi söyle: beni tanıdın mı?','Hayır','Belki'],['q7','???',1,'Işık kısılıyor. Yarın devam ederiz.','…','…']];
  return{cards:T.map(function(t,i){var n=i<6?['q'+(i+2)]:[];return{id:t[0],speaker:t[1],clarity:t[2],text:t[3],arc:'ana',left:{label:t[4],effects:{},next:n},right:Object.assign({label:t[5],effects:{},next:n},t[0]==='q3'?{set:['hatirliyor']}:{})}}),
    ending:'Sabit son: ',beats:[{t:'Uyanış ve sorgu',d:1},{t:'İlk büyük ifşa',d:0},{t:'Dönüm noktası',d:0}]};
}
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.cards)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mk(t){return esc(t).replace(/==([^=]+)==/g,'<mark class="hl">$1</mark>')}
function byId(id){return S.cards.filter(function(c){return c.id===id})[0]}
function nexts(c){return[].concat(c.left&&c.left.next||[],c.right&&c.right.next||[])}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1700)}

/* --- analiz --- */
function analyze(){
  var depth={},q=[],first=S.cards[0],bad={};
  if(first){depth[first.id]=0;q.push(first.id)}
  while(q.length){var id=q.shift(),c=byId(id);if(!c)continue;nexts(c).forEach(function(n){if(byId(n)&&depth[n]==null){depth[n]=depth[id]+1;q.push(n)}})}
  var issues=[];
  S.cards.forEach(function(c){
    if(depth[c.id]==null){bad[c.id]=1;issues.push(c.id+': hiçbir yerden ulaşılmıyor')}
    ['left','right'].forEach(function(d){((c[d]||{}).next||[]).forEach(function(n){if(!byId(n)){bad[c.id]=1;issues.push(c.id+': "'+n+'" diye kart yok')}})});
    if(!nexts(c).length&&c!==S.cards[S.cards.length-1]){bad[c.id]=1;issues.push(c.id+': devamı yok')}
  });
  return{depth:depth,bad:bad,issues:issues};
}

/* --- harita --- */
function renderMap(){
  var A=analyze(),rows=[],un=[],W=Math.min(innerWidth,820)-40,H=50,G=46;
  S.cards.forEach(function(c){var d=A.depth[c.id];if(d==null)un.push(c);else(rows[d]=rows[d]||[]).push(c)});
  if(un.length)rows.push(un);
  var pos={},html='',y=0;
  rows.forEach(function(r,ri){
    r=r||[];var w=Math.min(158,(W-(r.length-1)*10)/r.length),x0=(W-(r.length*w+(r.length-1)*10))/2;
    r.forEach(function(c,i){pos[c.id]={x:x0+i*(w+10),y:y,w:w};
      html+='<button class="nd'+(A.bad[c.id]?' bad':'')+'" data-open="'+c.id+'" style="left:'+pos[c.id].x+'px;top:'+y+'px;width:'+w+'px;--ac:'+(ARCS[c.arc]||ARCS.ana)[1]+';animation-delay:'+(ri*70+i*40)+'ms"><b>'+esc(c.id)+'</b><span>'+esc(c.speaker||'')+'</span></button>'});
    y+=H+G});
  var svg='';
  S.cards.forEach(function(c){var p=pos[c.id];if(!p)return;
    ['left','right'].forEach(function(d){((c[d]||{}).next||[]).forEach(function(n,k){var t=pos[n];if(!t)return;
      var x1=p.x+p.w*(d==='left'?.3:.7),y1=p.y+H,x2=t.x+t.w/2,y2=t.y,m=(y1+y2)/2;
      svg+='<path pathLength="1" d="M'+x1+' '+y1+'C'+x1+' '+m+' '+x2+' '+m+' '+x2+' '+y2+'" stroke="'+(d==='left'?'#4378a6':'#cf5238')+'" style="animation-delay:'+(300+k*60)+'ms"/>'})})});
  $('#v0').innerHTML=
    '<div class="warn rise">'+(A.issues.length?'<b>'+A.issues.length+' uyarı</b><span>'+esc(A.issues.slice(0,3).join(' · '))+(A.issues.length>3?' …':'')+'</span>':'<span>Sorun yok. Her kart ulaşılabilir ve devamı var.</span>')+'</div>'+
    '<div class="note rise" style="margin-bottom:14px"><span style="color:#8fb4d6">Mavi</span> çizgi sol seçimi, <span style="color:#ec8a74">kırmızı</span> çizgi sağ seçimi gösterir. Karta dokun, düzenle.</div>'+
    '<div class="map" style="height:'+Math.max(y,60)+'px"><svg width="'+W+'" height="'+y+'">'+svg+'</svg>'+html+'</div>';
  $('#sub').textContent=S.cards.length+' kart'+(A.issues.length?' · '+A.issues.length+' uyarı':'');
}

/* --- kartlar --- */
function renderCards(){
  $('#v1').innerHTML=S.cards.map(function(c,i){
    var L=c.left||{},R=c.right||{};
    return'<button class="ci rise" data-open="'+esc(c.id)+'" style="--i:'+i+';--ac:'+(ARCS[c.arc]||ARCS.ana)[1]+'"><small>'+esc(c.id)+' · '+esc(c.speaker||'Konuşan yok')+'</small><p>'+(mk(c.text)||'<span style="color:#8e8e93">Boş kart</span>')+'</p><span class="ch l">← '+esc(L.label||'—')+'</span><span class="ch r">'+esc(R.label||'—')+' →</span></button>'}).join('');
}

/* --- omurga --- */
function renderSpine(){
  var seeds=[];S.cards.forEach(function(c){String(c.text).replace(/==([^=]+)==/g,function(_,m){seeds.push([c.id,m])})});
  $('#v2').innerHTML=
    '<h2 class="rise" style="margin-top:6px">Sabit son</h2><textarea id="end" class="rise" placeholder="Hikayenin değişmeyen sonu, tek paragraf…">'+esc(S.ending)+'</textarea>'+
    '<h2>Ana duraklar</h2><p class="note" style="margin:-6px 0 12px">Hangi yoldan gidilirse gidilsin herkesin geçeceği kırılma noktaları.</p>'+
    S.beats.map(function(b,i){return'<div class="beat rise'+(b.d?' done':'')+'" style="--i:'+i+'"><button class="ck" data-bt="'+i+'">✓</button><input data-bi="'+i+'" value="'+esc(b.t)+'" placeholder="Durak"><button class="x" data-bd="'+i+'">×</button></div>'}).join('')+
    '<button class="btn" id="addBeat" style="width:100%;margin-top:6px">Durak ekle</button>'+
    '<h2>Tohumlar</h2><p class="note" style="margin:-6px 0 12px">Kart metninde bir ifadeyi marker ile işaretlersen buraya düşer. Sonda karşılığını vereceğin ipuçları.</p>'+
    (seeds.length?seeds.map(function(s,i){return'<button class="seed rise" data-open="'+esc(s[0])+'" style="--i:'+i+'"><mark class="hl">'+esc(s[1])+'</mark><small>'+esc(s[0])+' kartında</small></button>'}).join(''):'<div class="note">Henüz tohum yok.</div>');
}

/* --- kart düzenleyici --- */
var cur=null;
function sideHTML(d){
  var o=cur[d]||(cur[d]={label:'',effects:{}}),e=o.effects||{};
  return'<div class="side"><label>'+(d==='left'?'← Sola kaydırınca':'Sağa kaydırınca →')+'</label><input data-p="'+d+'.label" value="'+esc(o.label)+'" placeholder="Seçim etiketi">'+
    '<label>Etkiler</label><div class="eff">'+Object.keys(STATS).map(function(k){var v=e[k]||0;return'<div class="ef"><small>'+STATS[k]+'</small><b class="'+(v>0?'p':v<0?'n':'')+'">'+(v>0?'+':'')+v+'</b><button data-e="'+d+'.'+k+'" data-d="-5">−</button><button data-e="'+d+'.'+k+'" data-d="5">+</button></div>'}).join('')+'</div>'+
    '<label>Bayrak koy (virgülle)</label><input data-l="'+d+'.set" value="'+esc((o.set||[]).join(', '))+'" placeholder="hatirliyor">'+
    '<label>Sıradaki kartlar (virgülle)</label><input data-l="'+d+'.next" class="'+((o.next||[]).some(function(n){return!byId(n)})?'bad-in':'')+'" value="'+esc((o.next||[]).join(', '))+'" placeholder="q2, q3"></div>';
}
function openSheet(id){
  cur=byId(id);if(!cur)return;
  var a=Object.keys(ARCS),i=Math.max(0,a.indexOf(cur.arc||'ana'));
  $('#sheet').innerHTML='<div class="sh"><b>'+esc(cur.id)+'</b><button class="x" data-close>×</button></div>'+
    '<div class="seg"><i style="transform:translateX('+i*100+'%)"></i>'+a.map(function(k){return'<button data-arc="'+k+'" class="'+(k===(cur.arc||'ana')?'on':'')+'">'+ARCS[k][0]+'</button>'}).join('')+'</div>'+
    '<label>Konuşan</label><input data-p="speaker" value="'+esc(cur.speaker)+'">'+
    '<label>Metin</label><textarea id="txt" data-p="text">'+esc(cur.text)+'</textarea>'+
    '<div class="row"><button class="btn" id="mkBtn">Marker ile işaretle</button></div><div class="prev" id="prev">'+mk(cur.text)+'</div>'+
    sideHTML('left')+sideHTML('right')+
    '<div class="row" style="margin-top:20px"><button class="btn d" data-del>Kartı sil</button></div>';
  $('#dim').classList.add('on');$('#sheet').classList.add('on');$('#sheet').scrollTop=0;
}
function closeSheet(){$('#dim').classList.remove('on');$('#sheet').classList.remove('on');cur=null;refresh()}
function setPath(p,v){var k=p.split('.'),o=cur;while(k.length>1){o=o[k.shift()]=o[k[0]]||{}}o[k[0]]=v;save()}
function list(v){return v.split(',').map(function(x){return x.trim()}).filter(Boolean)}

/* --- oyun dosyası --- */
var ioMode='';
function code(){return'/* CARDS:BEGIN */\nwindow.CARDS = '+JSON.stringify(S.cards,null,2)+';\n/* CARDS:END */'}
function openIO(){
  $('#sheet').innerHTML='<div class="sh"><b>Oyun dosyası</b><button class="x" data-close>×</button></div>'+
  '<p class="note">Oyunun index.html dosyasını seç. Kartları içeri alırsın ya da yaptığın değişiklikleri sadece kart bölümüne işleyip güncel dosyayı indirirsin. Oyunun kodu ve çizimler bozulmaz.</p>'+
  '<div class="row"><button class="btn" data-io="in">Kartları oyundan al</button></div><div class="row"><button class="btn p" data-io="out">Oyuna işle ve indir</button></div><div class="row"><button class="btn" data-io="copy">Sadece kart kodunu kopyala</button></div>';
  $('#dim').classList.add('on');$('#sheet').classList.add('on');
}
function between(h){var b=h.indexOf('/* CARDS:BEGIN */'),e=h.indexOf('/* CARDS:END */');
  if(b>-1&&e>b)return[b,e+'/* CARDS:END */'.length];
  b=h.indexOf('window.CARDS = [');e=h.indexOf('\n];',b);return b>-1&&e>b?[b,e+3]:null}
$('#file').addEventListener('change',function(ev){
  var f=ev.target.files[0];ev.target.value='';if(!f)return;
  var r=new FileReader();r.onload=function(){
    var h=String(r.result),rg=between(h);if(!rg)return toast('Dosyada kart bölümü bulunamadı');
    if(ioMode==='in'){
      try{var t=h.slice(rg[0],rg[1]).replace('/* CARDS:BEGIN */','').replace('/* CARDS:END */','').replace('window.CARDS =','').trim().replace(/;$/,'');
        var cs=new Function('return '+t)();cs.forEach(function(c){c.arc=c.arc||'ana'});S.cards=cs;save();closeSheet();toast(cs.length+' kart alındı')}catch(e){toast('Kartlar okunamadı')}
    }else{
      var out=h.slice(0,rg[0])+code()+h.slice(rg[1]),a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('Güncel dosya indirildi')}
  };r.readAsText(f)});

/* --- gezinme --- */
var tab=0;
function refresh(){renderMap();renderCards();renderSpine()}
function go(i){tab=i;$('#ni').style.transform='translateX('+i*100+'%)';
  document.querySelectorAll('nav button').forEach(function(b,k){b.classList.toggle('on',k===i)});
  [0,1,2].forEach(function(k){$('#v'+k).classList.toggle('on',k===i)});$('#fab').classList.toggle('off',i===2)}
document.querySelectorAll('nav button').forEach(function(b,i){b.onclick=function(){go(i)}});
$('#ioBtn').onclick=openIO;$('#dim').onclick=closeSheet;
$('#fab').onclick=function(){var n=S.cards.length+1,id='k'+n;while(byId(id))id='k'+(++n);S.cards.push({id:id,speaker:'',text:'',arc:'ana',left:{label:'',effects:{},next:[]},right:{label:'',effects:{},next:[]}});save();openSheet(id)};
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.open)return openSheet(t.dataset.open);
  if('close'in t.dataset)return closeSheet();
  if(t.dataset.io){ioMode=t.dataset.io;if(ioMode==='copy'){(navigator.clipboard?navigator.clipboard.writeText(code()):Promise.reject()).then(function(){toast('Kopyalandı')},function(){toast('Kopyalanamadı')});return}return $('#file').click()}
  if(t.dataset.arc){cur.arc=t.dataset.arc;save();return openSheet(cur.id)}
  if(t.dataset.e){var p=t.dataset.e.split('.'),o=cur[p[0]].effects=cur[p[0]].effects||{},v=Math.max(-50,Math.min(50,(o[p[1]]||0)+ +t.dataset.d));if(v)o[p[1]]=v;else delete o[p[1]];save();var s=$('#sheet').scrollTop;openSheet(cur.id);$('#sheet').scrollTop=s;return}
  if('del'in t.dataset){if(confirm(cur.id+' kartı silinsin mi?')){S.cards=S.cards.filter(function(c){return c!==cur});save();closeSheet()}return}
  if(t.id==='mkBtn'){var x=$('#txt'),a=x.selectionStart,b=x.selectionEnd;if(a===b)return toast('Önce metinde bir ifade seç');x.value=x.value.slice(0,a)+'=='+x.value.slice(a,b)+'=='+x.value.slice(b);cur.text=x.value;save();$('#prev').innerHTML=mk(cur.text);return}
  if(t.id==='addBeat'){S.beats.push({t:'',d:0});save();renderSpine();return}
  if(t.dataset.bt!=null){var b=S.beats[+t.dataset.bt];b.d=b.d?0:1;save();t.parentNode.classList.toggle('done',!!b.d);return}
  if(t.dataset.bd!=null){S.beats.splice(+t.dataset.bd,1);save();renderSpine()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='end'){S.ending=t.value;save();return}
  if(t.dataset.bi!=null){S.beats[+t.dataset.bi].t=t.value;save();return}
  if(!cur)return;
  if(t.dataset.p){setPath(t.dataset.p,t.value);if(t.dataset.p==='text')$('#prev').innerHTML=mk(t.value)}
  if(t.dataset.l){var v=list(t.value),p=t.dataset.l;setPath(p,v);if(/next$/.test(p))t.classList.toggle('bad-in',v.some(function(n){return!byId(n)}))}
});
// Service worker (HTTPS gerekir)
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
refresh();go(0);
</script>
</body>
</html>
