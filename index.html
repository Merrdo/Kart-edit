<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Akan Yazı Editör</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<script>
/* İlk çizimden önce gerçek ekran yüksekliğini ve kurulu/tarayıcı modunu belirle */
(function () {
  var d = document.documentElement, w = window, n = w.navigator;
  var st = n.standalone === true || (w.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  var h = w.innerHeight;
  if (st) h = Math.max(h, w.innerHeight >= w.innerWidth ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width));
  d.style.setProperty('--full-h', h + 'px');
  if (!st) d.classList.add('browser');
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yazı Editör">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#000;--surface:#0f0f10;--surface2:#1b1b1d;--line:rgba(255,255,255,.09);
  --ink:#f7f7f5;--dim:#8e8e93;--ph:#55555a;
  --accent:#e0503a;--acc-rgb:224,80,58;--accent-ink:#fff;--accent-soft:rgba(224,80,58,.16);
  --blue:#5b9bd5;--green:#3f9a7c;--amber:#e0a43a;--danger:#ff5a4d;
  --r:20px;--ease:cubic-bezier(.32,.72,0,1);--serif:Georgia,'Times New Roman',serif;
  --pt:max(env(safe-area-inset-top,0px),20px);
  --pb:max(env(safe-area-inset-bottom,0px),18px);
  --tbh:calc(54px + var(--pb));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:var(--full-h,100%);min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased}
.stage{position:absolute;top:0;left:0;width:100%;height:var(--full-h,100%);overflow:hidden;overflow:clip}
html.ready .stage{transition:height .32s cubic-bezier(.22,.9,.24,1)}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s var(--ease),background .2s,color .2s}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
b{font-weight:700;font-variant-numeric:tabular-nums}

/* ---- görünümler ---- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;overflow:clip}
.scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 20px 28px}
.top{padding:var(--pt) 20px 14px;display:flex;align-items:center;gap:12px;flex:none}
.ttl{flex:1;min-width:0}
.top h1{font-size:1.7rem;letter-spacing:-.03em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--dim);font-size:.85rem;margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.icon-btn:active{transform:scale(.9);background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.acc{background:var(--accent);color:var(--accent-ink)}
.primary{width:100%;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 28px -12px rgba(var(--acc-rgb),.55)}
.primary:active{transform:scale(.975);filter:brightness(.92)}
.primary.sec{background:var(--surface2);color:var(--ink);box-shadow:none}
.primary svg{width:18px;height:18px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}

/* ---- ana kabuk ---- */
#home .tpages{position:absolute;left:0;top:0;bottom:var(--tbh);width:500%;display:flex;will-change:transform}
.tpage{position:relative;flex:0 0 20%;min-width:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip;backface-visibility:hidden}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tbh);z-index:6;display:grid;grid-template-columns:repeat(5,1fr);padding:5px 10px var(--pb);padding-bottom:calc(var(--pb) - 8px);background:var(--bg);border-top:1px solid var(--line)}
html.kbd .tabbar{opacity:0;pointer-events:none;transition:opacity .2s}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim)}
html.ready .tb{transition:color .35s var(--ease)}
.tb svg{width:25px;height:25px;transition:transform .45s var(--ease)}
.tb span{font-size:.68rem;font-weight:650}
.tb:active svg{transform:scale(.88)}
.tb.on{color:var(--accent)}
.tb.on svg{transform:translateY(-1px)}
.tb-ind{position:absolute;top:-1px;left:0;width:calc((100% - 20px)/5);height:2px;margin-left:10px;pointer-events:none;will-change:transform}
.tb-ind::after{content:"";display:block;width:26px;height:2px;margin:0 auto;border-radius:0 0 2px 2px;background:var(--accent)}

/* ---- liste kartları ---- */
.card{width:100%;text-align:left;display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card:active{transform:scale(.98);background:var(--surface2)}
.tile{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent)}
.card .bd{flex:1;min-width:0;padding-top:1px}
.card .name{font-size:.82rem;color:var(--dim);font-weight:600;display:flex;gap:8px;align-items:center}
.card .name i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.card p{font-family:var(--serif);font-size:1.02rem;line-height:1.38;margin:4px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p.none{font-family:inherit;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--dim);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.l{color:#8fb4d6}.chip.r{color:#ec8a74}
.filters{display:flex;gap:8px;margin:0 -20px 14px;padding:0 20px;overflow-x:auto;touch-action:pan-x}
.fl-chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.88rem;color:var(--dim)}
.fl-chip.on{background:var(--accent-soft);border-color:rgba(var(--acc-rgb),.4);color:var(--accent)}
.empty{text-align:center;color:var(--dim);padding:10vh 32px 0;line-height:1.5;font-size:.95rem}
.empty h2{color:var(--ink);font-size:1.2rem;letter-spacing:-.02em;margin-bottom:6px}

/* ---- bölüm / form satırları ---- */
.fsec{margin-bottom:26px}
.fcap{color:var(--dim);font-size:.76rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:0 4px 10px}
.fhint{color:var(--dim);font-size:.82rem;line-height:1.45;padding:10px 4px 0}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s,box-shadow .3s}
.fcard>*+*{border-top:1px solid var(--line)}
.fcard:focus-within{border-color:rgba(var(--acc-rgb),.45)}
.finput{display:block;width:100%;min-width:0;background:none;border:0;outline:0;resize:none;padding:16px 18px;font-size:1.05rem;line-height:1.45;caret-color:var(--accent)}
.finput::placeholder{color:var(--ph)}
textarea.finput{min-height:120px;font-family:var(--serif);font-size:1.05rem}
.fcell{padding:12px 18px 6px}
.fcell small{display:block;color:var(--dim);font-size:.74rem;font-weight:650;letter-spacing:.02em}
.fcell .finput{padding:6px 0 10px;font-size:1.02rem}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 12px 10px 18px;width:100%;text-align:left}
.frow.seg-row{min-height:0;padding:8px}
.fl{font-weight:600;font-size:1rem;letter-spacing:-.01em;min-width:0}
.fl small{display:block;color:var(--dim);font-size:.78rem;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
.frow.lnk:active{background:var(--surface2)}
.chev svg{width:18px;height:18px;color:var(--dim);display:block}
.in-ic{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--accent);margin-right:2px}
.in-ic svg{width:24px;height:24px}
.frow.lead{justify-content:flex-start;gap:12px}
.frow.lead .fl{flex:1}
.frow.lead .fl small{white-space:normal;max-width:none}
.warnrow small{color:var(--amber)}
.seg{position:relative;width:100%;display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--bg);border-radius:13px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,3));background:var(--surface2);border-radius:10px;transform:translateX(calc(var(--k,0)*100%));transition:transform .35s var(--ease)}
.seg button{position:relative;z-index:1;height:40px;font-weight:600;font-size:.9rem;color:var(--dim)}
.seg button.on{color:var(--ink)}
.stepper{display:flex;align-items:center;flex:none}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--surface2);font-size:1.3rem;line-height:1;display:grid;place-items:center}
.stepper button:active{background:var(--bg);transform:scale(.9)}
.stepper .val{min-width:58px;text-align:center;font-size:1.05rem}
.stepper .val b.p{color:#7ccf9d}.stepper .val b.n{color:#ec8a74}.stepper .val b.z{color:var(--dim);font-weight:600}
.sw-ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;color:transparent}
.sw-ck svg{width:14px;height:14px}
.beat.done .sw-ck{background:var(--accent);border-color:var(--accent);color:#fff}
.beat.done input{color:var(--dim);text-decoration:line-through}
.beat input{flex:1;min-width:0;background:none;border:0;outline:0;padding:8px 0;font-size:1.02rem;caret-color:var(--accent)}
.beat .x{width:36px;height:36px;border-radius:50%;color:var(--dim);display:grid;place-items:center;flex:none}
.beat .x svg{width:16px;height:16px}
.beat{padding-left:14px}
.prevbox{padding:14px 18px 16px}
.prevbox small{display:block;color:var(--dim);font-size:.74rem;font-weight:650;margin-bottom:6px}
.prev{font-family:var(--serif);font-size:1.1rem;line-height:1.5;color:rgba(247,247,245,.92);min-height:1.5em}
mark.hl{color:var(--ink);padding:.12em 7px .1em 0;margin:0 -7px 0 0;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;--c:rgba(224,80,58,.4);background:linear-gradient(var(--c),var(--c)) no-repeat 0 0/100% 100%;box-shadow:-7px 0 0 0 var(--c)}
.seedtxt{font-family:var(--serif);font-size:1.02rem}

/* ---- harita ---- */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--dim);font-size:.8rem;font-weight:600;margin:2px 4px 16px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.map{position:relative}
.map svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map path{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.65;vector-effect:non-scaling-stroke}
.map.anim path{animation:fadeIn .8s var(--ease) both}
@keyframes fadeIn{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
.nd{position:absolute;height:92px;border-radius:15px;background:var(--surface2);border:1.5px solid var(--line);padding:6px 10px;text-align:left;overflow:hidden}
.map.anim .nd{animation:rise .5s var(--ease) both}
.nd:active{transform:scale(.96)}
.nd b{display:block;font-size:.8rem;white-space:nowrap}
.nd span{display:block;font-size:.72rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}



/* ---- uyarı / durum ikonları ---- */
.t-orphan{--tc:var(--amber)}.t-dead{--tc:var(--danger)}.t-miss{--tc:#ec8a74}
.nd.bad{border-color:var(--tc,var(--amber));border-style:dashed}
.nd.bad b{padding-right:20px}
.nd.has{padding:0;background:#1b2127}
.nd.has>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.nd.has .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.86));text-align:left}
.nd.has .cap b{padding-right:0;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.nd.has .cap span{color:rgba(255,255,255,.72)}
.nd.has::after{display:none}
.nd.has .nb{background:rgba(0,0,0,.62);border-radius:50%;padding:3px;width:22px;height:22px;top:5px;right:5px;z-index:2}
.nd .nb{position:absolute;top:6px;right:6px;width:16px;height:16px;color:var(--tc);font-style:normal}
.nd .nb svg,.bi svg,.sic svg,.kc svg,.iss-ic svg,.maplbl svg,.okpill svg{width:100%;height:100%;display:block}
.bi{display:inline-block;width:15px;height:15px;color:var(--tc);flex:none}
.sic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin:0 4px 0 0}
.sic.w{color:var(--amber)}.sic.g{color:#7ccf9d}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--surface2);font-size:.78rem;font-weight:650;color:var(--ink)}
.kc i{display:block;width:15px;height:15px;color:var(--tc)}
.maplbl{position:absolute;left:0;display:inline-flex;align-items:center;gap:6px;height:20px;padding-right:8px;background:var(--bg);color:var(--amber);font-size:.74rem;font-weight:700;z-index:1}
.maplbl .ic{display:block;width:14px;height:14px}
.iss{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.iss>*+*{border-top:1px solid var(--line)}
.iss-hd{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;text-align:left}
.iss-hd:active{background:var(--surface2)}
.iss-hd .nm{flex:1;min-width:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iss-hd .nm small{color:var(--dim);font-weight:500;font-size:.85rem}
.iss-row{display:flex;gap:12px;padding:12px 16px 14px}
.iss-ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;padding:7px;background:var(--surface2);color:var(--tc)}
.iss-tx{flex:1;min-width:0}
.iss-tx b{display:block;font-size:.95rem;color:var(--tc)}
.iss-tx p{color:var(--dim);font-size:.84rem;line-height:1.4;margin:3px 0 0}
.iss-tx p b{display:inline;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.act{height:36px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem}
.act:active{transform:scale(.95)}
.act.s{background:var(--surface2);color:var(--ink)}
.act.d{background:rgba(255,90,77,.12);color:var(--danger)}
.okpill{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(63,154,124,.12);color:#7ccf9d;font-weight:650;font-size:.92rem}
.okpill .ic{display:block;width:22px;height:22px;flex:none}
.endrow.on .sw-ck{background:var(--accent);border-color:var(--accent);color:#fff}
.fxi{cursor:default}
.sd{display:flex;gap:6px;flex:none}
.sd button{height:36px;min-width:50px;padding:0 12px;border-radius:12px;background:var(--surface2);font-size:.82rem;font-weight:700}
.sd .l{color:#8fb4d6}.sd .r{color:#ec8a74}
.sd .l.on{background:var(--blue);color:#fff}.sd .r.on{background:var(--accent);color:#fff}
.frow.danger .in-ic,.frow.danger .fl{color:var(--danger)}
.frow.danger .fl small{color:var(--dim)}
.dbtn.ok.dng{background:var(--danger)}


/* ---- uzun basma paneli, sıralama modu ---- */
.map.reorder .nd{touch-action:none;transition:left .3s var(--ease),top .3s var(--ease),width .3s var(--ease),transform .2s var(--ease),box-shadow .2s}
.map.reorder .nd.lift{z-index:5;transition:transform .2s var(--ease),box-shadow .2s;transform:scale(1.06);border-color:var(--accent);box-shadow:0 16px 32px -6px rgba(0,0,0,.75)}
.map.reorder .nd:not(.lift){animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-.9deg)}75%{transform:rotate(.9deg)}}
.rbar{position:absolute;left:14px;right:14px;bottom:12px;z-index:8;display:none;align-items:center;gap:8px;padding:10px 10px 10px 16px;background:#1b1b1d;border:1px solid rgba(var(--acc-rgb),.5);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.65)}
html.rmode .rbar{display:flex}
.rbar.pkbar{display:none}html.pmode .rbar.pkbar{display:flex}html.rmode .rbar.pkbar{display:none}html.pmode .toast{bottom:calc(var(--tbh) + 86px)}
html.rmode .toast{bottom:calc(var(--tbh) + 86px)}
.rb-t{flex:1;min-width:0}
.rb-t b{display:block;font-size:.9rem}
.rb-t small{display:block;color:var(--dim);font-size:.74rem;line-height:1.3;margin-top:1px}
.rbar .act:disabled{opacity:.35}
.opt .oi svg{width:20px;height:20px}
.opt.dng .oi{color:var(--danger);background:rgba(255,90,77,.12)}
.opt.dng .ot b{color:var(--danger)}
.okpill.info{background:var(--surface);border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:.86rem;line-height:1.4}
.okpill.info .ic{width:20px;height:20px;color:var(--blue)}

/* ---- kart formu (tam ekran sayfa) ---- */
#cardForm{z-index:12;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
#cardForm.open{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
#cardForm.drag{transition:none}
.edge{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:60;touch-action:none}
.form-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 20px var(--pb);border-top:1px solid var(--line);background:var(--bg);transition:padding .3s}
html.kbd .form-foot{padding-bottom:12px}
.ghost{height:46px;border-radius:14px;font-weight:600;color:var(--danger)}
.ghost:active{transform:scale(.97)}
.ghost.confirm{background:rgba(255,90,77,.14)}
#cfBody>.fsec{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*70ms)}
.sidecap{display:flex;align-items:center;gap:8px}
.sidecap i{width:14px;height:3px;border-radius:2px}

/* ---- alt paneller ---- */
.sht{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sht.open{opacity:1;pointer-events:auto}
.sht-card{width:100%;max-height:82%;display:flex;flex-direction:column;background:#101012;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px var(--pb);transform:translateY(100%);transition:transform .45s var(--ease)}
.sht.open .sht-card{transform:none}
.sht h2{font-size:1.3rem;letter-spacing:-.02em}
.sht .ssub{color:var(--dim);font-size:.88rem;line-height:1.4;margin:4px 0 14px}
.sht-list{overflow-y:auto;margin:0 -8px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sht .primary{flex:none;margin-top:8px}
.opt{width:100%;display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;text-align:left}
.opt:active{background:var(--surface2)}
.opt .oi{flex:none;min-width:42px;height:42px;padding:0 6px;border-radius:13px;background:var(--surface2);color:var(--dim);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt.on .oi{background:var(--accent-soft);color:var(--accent)}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:1rem;font-weight:650}
.opt .ot small{display:block;color:var(--dim);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ck{flex:none;width:22px;height:22px;color:var(--accent);opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s var(--ease)}
.opt.on .ck{opacity:1;transform:none}
.opt.bad .ot small{color:var(--amber)}
.dbtns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dbtn{height:56px;border-radius:18px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.dbtn:active{transform:scale(.97)}
.dbtn.no{background:var(--surface2)}
.dbtn.ok{background:var(--accent);color:#fff}
.toast{position:absolute;left:50%;bottom:calc(var(--tbh) + 14px);transform:translate(-50%,20px);background:var(--ink);color:#000;padding:10px 18px;border-radius:20px;font-weight:650;font-size:.9rem;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:50;white-space:nowrap;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--press:rgba(255,255,255,.04);--faint:#7a7a80;--line2:rgba(255,255,255,.22)}
/* grup tarzı liste */
.it{position:relative;display:flex;align-items:center;gap:16px;width:calc(100% + 40px);margin:0 -20px;padding:15px 20px;text-align:left;animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.it+.it::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.it:active{background:var(--press)}
.it .bd{flex:1;min-width:0}
.it .nm{font-size:1.18rem;font-weight:580;letter-spacing:-.015em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sb{color:var(--dim);font-size:.95rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif)}
.it>svg.cv{width:16px;height:16px;color:var(--faint);flex:none}
.gcv{flex:none;width:60px;height:60px;border-radius:17px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px;z-index:5;background:var(--bg);border-top:1px solid var(--line)}
/* aşamalı kart oluşturma */
.wz-prog{display:none;flex:1;gap:6px}.wz-step{display:none;min-width:34px;text-align:right;color:var(--dim);font-size:.85rem;font-weight:650}
#cardForm.wz .wz-prog{display:flex}#cardForm.wz .wz-step{display:block}#cardForm.wz .top .ttl{display:none}
.wz-seg{position:relative;flex:1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;align-self:center}
.wz-seg i{position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.wz-seg.on i{transform:scaleX(1)}
.wz-h{font-size:2.3rem;font-weight:780;letter-spacing:-.04em;line-height:1.1;animation:rise .5s var(--ease) backwards}
.wz-p{margin:8px 0 24px;color:var(--dim);font-size:1rem;line-height:1.4}
.wz-title{display:block;width:100%;background:none;border:0;outline:0;padding:0;margin-top:3vh;caret-color:var(--accent);font-size:2.3rem;font-weight:780;letter-spacing:-.04em;line-height:1.12}
.wz-title::placeholder{color:var(--ph)}
.wz-row{display:flex;align-items:center}
.wz-bk{flex:none;width:54px;height:54px;margin-right:10px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;transition:width .45s var(--ease),margin .45s var(--ease),opacity .3s}
.wz-bk svg{width:22px;height:22px}.wz-bk.off{width:0;margin-right:0;opacity:0;pointer-events:none}

/* kart sayfası */
#cardPage{display:none;z-index:10}
#cpScroll{position:absolute;inset:0;padding:0}
.hero{position:relative;overflow:hidden;height:clamp(170px,22vh,220px)}
.hero.art{background:#1b2127}
.hero.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hero.art::before{content:"";position:absolute;left:0;right:0;top:0;height:130px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:1;pointer-events:none}
.hero .hl{position:absolute;right:-14px;bottom:-78px;font-size:330px;line-height:1;font-weight:800;letter-spacing:-.06em;opacity:.2;pointer-events:none}
.gbody{position:relative;z-index:3;margin-top:-30px;background:var(--bg);border-radius:30px 30px 0 0;padding:30px 20px 60px;min-height:calc(var(--full-h,100vh) - 150px)}
.bub{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px 22px 24px;margin-top:2px}
.bub::before{content:"";position:absolute;top:-8px;left:34px;width:16px;height:16px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);border-radius:4px 0 0 0}
.hscrim{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(transparent,rgba(0,0,0,.78));z-index:1;pointer-events:none}
.hero:not(.art) .hscrim{height:70%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.hnm{position:absolute;left:20px;right:70px;bottom:44px;z-index:2;font-size:2.15rem;font-weight:800;letter-spacing:-.04em;line-height:1.02;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55);overflow-wrap:anywhere;pointer-events:none}
.hnm.none{font-size:1.3rem;font-weight:650;letter-spacing:-.02em;color:rgba(255,255,255,.55)}
.bsp{display:flex;align-items:center;gap:9px;font-size:.74rem;font-weight:750;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.bsp i{width:8px;height:8px;border-radius:50%;background:var(--bc,var(--accent));flex:none}
.bsp.set{color:var(--ink)}
.btx{font-family:var(--serif);font-size:1.55rem;line-height:1.36;letter-spacing:-.012em;color:var(--ink);overflow-wrap:anywhere}
.btx.none{font-family:inherit;font-size:1rem;color:var(--dim);letter-spacing:0}
.gt{font-size:1.9rem;font-weight:750;letter-spacing:-.035em;line-height:1.1;overflow-wrap:anywhere}
.cpmeta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.cpmeta span{background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:650;color:var(--dim)}
.cptx{font-family:var(--serif);font-size:1.15rem;line-height:1.55;margin-top:18px;color:rgba(247,247,245,.92)}.cptx.none{font-family:inherit;color:var(--dim)}
.gbody .iss{margin-top:18px}
.stats3{display:flex;margin-top:24px}.stats3 .st{flex:1;min-width:0;padding:2px 14px;border-left:1px solid var(--line)}.stats3 .st:first-child{padding-left:0;border-left:0}
.stats3 .st b{display:block;font-size:1.12rem;font-weight:650}.stats3 .st span{display:block;color:var(--dim);font-size:.9rem;margin-top:3px}
.sech{display:flex;align-items:baseline;gap:8px;margin:32px 0 4px}.sech h2{font-size:1.5rem;font-weight:700;letter-spacing:-.025em}
.cpch{margin:10px 0 6px;padding:2px 0 2px 14px;border-left:3px solid var(--blue)}.cpch.right{border-color:var(--accent)}
.cpch b{display:block;font-size:1.15rem}.cpch span{display:block;color:var(--dim);font-size:.92rem;margin-top:3px}
.cpnone{color:var(--dim);margin-top:10px}
.fbtn{position:absolute;top:var(--pt);z-index:6;background:rgba(18,18,20,.72);box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.ghead{position:absolute;left:0;right:0;top:0;height:calc(var(--pt) + 50px);z-index:5;pointer-events:none;--p:0;opacity:var(--p);background:var(--bg);border-bottom:1px solid var(--line)}
.ghead span{position:absolute;left:76px;right:76px;top:var(--pt);height:42px;line-height:42px;text-align:center;font-size:1.02rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtool{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:calc(var(--pt) - 8px) 10px 0;pointer-events:none}
.mtool>*{pointer-events:auto}
.mtool .icon-btn{background:rgba(24,24,26,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.mtool .icon-btn.acc{background:var(--accent);border-color:transparent}
.mcnt{margin-right:auto;pointer-events:none;color:var(--dim);font-size:.72rem;font-weight:650;background:rgba(24,24,26,.6);border-radius:10px;padding:4px 9px}
.mcnt:empty{display:none}
.icon-btn.sm{width:38px;height:38px;position:relative}.icon-btn.sm svg{width:19px;height:19px}
.icon-btn.sm.w{color:var(--amber)}.icon-btn.sm.g{color:#7ccf9d}
.mbadge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber);color:#000;font-size:.68rem;font-weight:800;font-style:normal;display:grid;place-items:center}
.mtool{transition:opacity .3s var(--ease)}
.tabbar{transition:transform .35s var(--ease),opacity .25s}
#home .tpages{transition:bottom .35s var(--ease)}
html.mfull .tabbar{transform:translateY(105%);opacity:0;pointer-events:none}
html.mfull #home .tpages{bottom:0}
html.mfull .mtool{opacity:0;pointer-events:none}
html.mfull .mtool>*{pointer-events:none}
html.mfull .toast{bottom:calc(var(--pb) + 14px)}
.icon-btn.sm.mfx{position:absolute;top:calc(var(--pt) - 8px);right:10px;z-index:9;opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .25s var(--ease),transform .3s var(--ease);background:rgba(24,24,26,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
html.mfull .mfx.show{opacity:1;pointer-events:auto;transform:none}
/* ---- tasarım sayfası (oyundaki kart çizimleri) ---- */
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.atile{display:block;width:100%;text-align:left;min-width:0}
.aimg{position:relative;aspect-ratio:1;border-radius:24px;overflow:hidden;background:#1b2127;border:1px solid var(--line);box-shadow:0 16px 30px -16px rgba(0,0,0,.9);transition:transform .2s var(--ease)}
.aimg img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.aimg b{position:absolute;left:9px;top:9px;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:.74rem;display:grid;place-items:center}
.atile:active .aimg{transform:scale(.96)}
.anm{margin-top:10px;padding:0 4px;font-weight:650;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aprev{width:min(54vw,230px);aspect-ratio:1;margin:2px auto 18px;border-radius:26px;overflow:hidden;background:#1b2127;border:1px solid var(--line);box-shadow:0 18px 36px -14px rgba(0,0,0,.9)}
.aprev img{display:block;width:100%;height:100%;object-fit:cover}
.empty .primary{margin-top:22px}
.pkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:0 8px 8px}
.pkgrid .aimg{border-radius:18px}
.pkgrid .anm{font-size:.8rem;margin-top:7px}
.pk.on .aimg{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pk.on .anm{color:var(--accent)}
.pk.none .aimg{display:grid;place-items:center;color:var(--dim);background:var(--surface)}
.pk.none .aimg svg{width:30px;height:30px}
.in-ic.th{width:34px;height:34px;border-radius:10px;overflow:hidden;background:#1b2127}
.in-ic.th img{width:100%;height:100%;object-fit:cover;display:block}
.in-ic.th svg{width:22px;height:22px}

/* ---- yatay akış haritası: yakınlaştırılabilir tuval ---- */
#mapBody{position:relative;padding:0;overflow:hidden;overflow:clip;touch-action:none;cursor:grab;overscroll-behavior:none}
#mapBody:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#mapBody .empty{padding-top:calc(var(--pt) + 14vh)}
.nd{padding:8px 11px}
.nd .tx{white-space:normal;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-family:var(--serif);font-size:.76rem;line-height:1.32;color:rgba(247,247,245,.78)}
.nd.has .tx{-webkit-line-clamp:2;color:rgba(255,255,255,.85)}
.nd .sp{margin-top:1px}

#mapBody[data-z="0"] .nd b{font-size:1.7rem;letter-spacing:-.03em;margin-top:6px}
#mapBody[data-z="0"] .nd.has .cap{padding-top:30px}
.elb{position:absolute;transform:translateY(-50%);padding:3px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:1}
.elb.l{color:#8fb4d6;border-color:rgba(91,155,213,.45)}.elb.r{color:#ec8a74;border-color:rgba(224,80,58,.45)}

.bk{position:absolute;display:flex;gap:4px;transform:translateX(-100%);pointer-events:none;z-index:2}
.bk span{font-size:.64rem;font-weight:750;padding:2px 6px;border-radius:7px;background:rgba(0,0,0,.74);color:#cfcfd2;border:1px solid var(--line);white-space:nowrap}
.bk .l{color:#8fb4d6}.bk .r{color:#ec8a74}
.zc{position:absolute;left:12px;bottom:12px;z-index:7;display:flex;align-items:center;gap:2px;padding:4px;border-radius:24px;background:rgba(24,24,26,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.zc button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;line-height:1}
.zc button:active{background:var(--surface2);transform:scale(.92)}
.zc button svg{width:18px;height:18px}
.zc .pct{min-width:50px;text-align:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim)}
html.rmode .zc{display:none}
html.mfull .zc{bottom:calc(var(--pb) + 8px)}

/* ---- işaretleyici editör ---- */
.ed{display:block;min-height:210px;padding:20px 18px 10px;font-family:var(--serif);font-size:1.2rem;line-height:1.6;outline:0;caret-color:var(--accent);white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.ed.empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.mkbar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px}

.mkbar:has(.mkb.on) .mkhint{color:var(--ink)}
.mkb{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--accent);border:1px solid var(--line);transition:background .25s var(--ease),color .25s,transform .2s var(--ease),box-shadow .3s}
.mkb svg{width:22px;height:22px}
.mkb:active{transform:scale(.92)}
.mkb.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 0 0 5px var(--accent-soft),0 8px 22px -8px rgba(var(--acc-rgb),.8)}
/* ---- seçim kartları ---- */
.sidehd{display:flex;align-items:center;gap:8px;padding-right:12px}
.sidehd .finput{flex:1;font-size:1.25rem;font-weight:650;letter-spacing:-.02em;padding:18px 6px 18px 18px}
.efbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface2);color:var(--dim);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.efbtn svg{width:18px;height:18px}
.efbtn:active{transform:scale(.9);background:var(--bg)}
.fcard.sidecard>.efsum{display:flex;flex-wrap:wrap;gap:6px;width:100%;text-align:left;padding:0 18px 16px;margin-top:-6px;border-top:0}
.ch{padding:4px 10px;border-radius:12px;background:var(--surface2);font-size:.78rem;font-weight:650;color:var(--dim)}
.ch.p{color:#7ccf9d}.ch.n{color:#ec8a74}.ch.f{color:var(--amber)}
.ch.none{background:none;padding:4px 0;font-weight:550}


/* ---- haritalar ---- */
.mleft{margin-right:auto;display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 0;pointer-events:none}
.mleft .mcnt{margin-right:0;flex:none}
.mname{pointer-events:auto;min-width:0;max-width:100%;color:var(--ink);font-size:.72rem;font-weight:650;background:rgba(24,24,26,.6);border-radius:10px;padding:4px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname:active{transform:scale(.96);background:rgba(44,44,48,.85)}
.mname-in{pointer-events:auto;min-width:0;width:100%;max-width:230px;background:var(--surface2);color:var(--ink);border:1.5px solid rgba(var(--acc-rgb),.55);border-radius:10px;outline:0;padding:3px 9px;font-size:16px;font-weight:650;caret-color:var(--accent)}

.sv{position:absolute;right:12px;bottom:19px;z-index:7;display:flex;align-items:center;gap:8px;pointer-events:none;transition:bottom .35s var(--ease)}
html.mfull .sv{bottom:calc(var(--pb) + 15px)}
html.rmode .sv,html.pmode .sv{display:none}
.sv-msg{height:30px;padding:0 13px;border-radius:15px;display:flex;align-items:center;background:rgba(24,24,26,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--amber);font-size:.78rem;font-weight:650;white-space:nowrap;opacity:0;transform:translateX(12px) scale(.96);transition:opacity .32s var(--ease),transform .42s var(--ease),color .3s}
.sv-msg.on{opacity:1;transform:none}
.sv-msg.ok{color:#7ccf9d}
.sv-msg span{transition:opacity .17s,transform .3s var(--ease)}
.sv-msg.sw span{opacity:0;transform:translateY(4px)}
.sv-btn{pointer-events:auto;position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(24,24,26,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(224,164,58,.5);color:var(--amber);transition:color .35s,border-color .35s,transform .15s var(--ease)}
.sv-btn.ok{color:#7ccf9d;border-color:rgba(124,207,157,.5)}
.sv-btn:active{transform:scale(.9)}

.sv-btn .i-ok{opacity:0;transform:scale(.5) rotate(-30deg)}
.sv-btn.ok .i-ok{opacity:1;transform:none}
.sv-btn.ok .i-no{opacity:0;transform:scale(.5) rotate(30deg)}
.sv-btn.pop{animation:svpop .55s var(--ease)}
@keyframes svpop{0%{transform:scale(.8)}55%{transform:scale(1.2)}100%{transform:none}}

#mapsPage{z-index:11;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
#mapsPage.open{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.mrow{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.mrow.on{border-color:rgba(var(--acc-rgb),.5)}
.mopen{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 8px 14px 16px;text-align:left}
.mopen:active{background:var(--surface2)}
.mtile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mtile svg{width:22px;height:22px}
.mbd{display:block;min-width:0;flex:1}
.mnm{display:flex;align-items:center;gap:8px;font-weight:650;font-size:1.02rem;letter-spacing:-.01em}
.mnm b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.mnm em{flex:none;font-style:normal;font-size:.66rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 7px}
.msb{display:block;color:var(--dim);font-size:.8rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdel{flex:none;width:44px;height:44px;margin-right:8px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.mdel:active{background:var(--surface2);color:var(--danger)}
.mdel svg{width:19px;height:19px}

/* ---- harita kartı: oyun tarzı sayfa ---- */
#gamePage{z-index:10;background:#000;will-change:opacity;--cw:min(78vw,340px);--ch:var(--cw);font-family:Georgia,'Times New Roman',serif;opacity:0;visibility:hidden;transition:opacity .32s var(--ease),visibility 0s .32s}
#gamePage:not(.open){pointer-events:none}
#gamePage.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.gp-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gp-side{position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;will-change:opacity}
.gp-l{background:radial-gradient(95% 75% at 0% 55%,rgba(84,122,146,.55),rgba(84,122,146,.12) 62%,transparent 100%),linear-gradient(90deg,rgba(84,122,146,.16),transparent 75%)}
.gp-r{background:radial-gradient(95% 75% at 100% 55%,rgba(200,108,82,.55),rgba(200,108,82,.12) 62%,transparent 100%),linear-gradient(270deg,rgba(200,108,82,.16),transparent 75%)}
.gp-opt{position:absolute;left:26px;right:26px;top:calc(50% + var(--ch)/2 + 58px);font:30px/1.15 Georgia,'Times New Roman',serif;color:#f1ebe0;opacity:0;will-change:transform,opacity}
.gp-l .gp-opt{text-align:left}.gp-r .gp-opt{text-align:right}
.gp-meta{position:absolute;left:26px;right:26px;bottom:calc(50% + var(--ch)/2 + 30px);z-index:2;pointer-events:none;text-align:center;color:#efe9dc}
.gp-spk{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.5;margin-bottom:10px}
.gp-txt{font-size:20px;line-height:1.38}
.gp-deck{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:1;pointer-events:none}
.gp-deck i{position:absolute;inset:0;border-radius:30px;background-color:#171c21;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);background-image:linear-gradient(45deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(-45deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:16px 16px}
.gp-deck i::after{content:'';position:absolute;inset:14px;border-radius:20px;border:1px solid rgba(255,255,255,.09)}
.gp-deck i:nth-child(1){transform:translateY(34px) scale(.88);background-color:#0d1115}
.gp-deck i:nth-child(2){transform:translateY(17px) scale(.94);background-color:#11161a}
.gp-deck i:nth-child(3){transform:none;background-color:#161b20}
.gp-card{position:relative;z-index:2;width:var(--cw);aspect-ratio:1/1;border-radius:30px;transform-origin:50% 130%;touch-action:none;cursor:grab;will-change:transform,opacity;opacity:0}
.gp-card *{pointer-events:none}
.gp-card.dragging{cursor:grabbing}
.gp-art{position:absolute;inset:0;border-radius:30px;background:#1b2127;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.gp-art img{display:block;width:100%;height:100%;object-fit:cover}
.gp-ph{position:absolute;inset:0;display:grid;place-items:center}
.gp-ph b{font-size:120px;line-height:1;font-weight:800;letter-spacing:-.05em;opacity:.22;color:#fff}
.gp-top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--pt) - 8px) 10px 0;pointer-events:none}
.gp-top>*{pointer-events:auto}
.gp-top .icon-btn{background:rgba(24,24,26,.94);border:1px solid var(--line)}
.gp-id{flex:1;min-width:0;text-align:center;pointer-events:none!important;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#efe9dc;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- ara sahne oynatıcı ---- */
.sc{position:absolute;inset:0;z-index:40;background:#000;opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;font-family:Georgia,'Times New Roman',serif;transition:opacity .6s ease,visibility 0s linear .6s}
.sc.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s ease}
.sc-bg{position:absolute;inset:0}
.sc-art{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;will-change:transform,opacity}
.sc::after{content:'';position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(transparent,rgba(0,0,0,.88));pointer-events:none}
.sc-txt{position:absolute;left:28px;right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:2;text-align:center;color:#efe9dc;font-size:21px;line-height:1.5;white-space:pre-wrap;opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
.sc-txt.in{opacity:1;transform:none}
.sc-txt.mid{top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.sc-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);z-index:2;text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#efe9dc;opacity:0;transition:opacity .7s ease}
.sc-hint.on{opacity:.45}
.sc-skip{position:absolute;z-index:3;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);appearance:none;-webkit-appearance:none;background:none;border:0;padding:12px;color:#efe9dc;opacity:.4;font:11px Georgia,'Times New Roman',serif;letter-spacing:.26em;text-transform:uppercase;cursor:pointer}

.pgc{margin-bottom:12px}
.pgh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 2px 16px;color:var(--dim);font-size:.85rem}
.pgh b{font-weight:650;color:var(--ink)}
.pgh span{display:flex;gap:2px}
.pgh button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.pgh button:disabled{opacity:.25}
.pgh svg{width:17px;height:17px}
.pgt{display:block;width:100%;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:1rem;line-height:1.45;padding:10px 16px 14px;resize:none;min-height:84px;caret-color:var(--accent)}
.pgt::placeholder{color:var(--ph)}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Ana kabuk: 4 sayfa (Harita · Kartlar · Omurga · Oyun) + alt sekme çubuğu -->
  <section class="view" id="home">
    <div class="tpages" id="tpages">
      <div class="tpage" role="tabpanel" aria-label="Harita">
        <div class="mtool"><div class="mleft"><span class="mcnt" id="subMap"></span><button type="button" class="mname" id="mapName" aria-label="Harita adını değiştir"></button></div><button class="icon-btn sm" id="mapFull" aria-label="Tam ekran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="icon-btn sm" id="mapStat" aria-label="Durum ve uyarılar"></button><button class="icon-btn sm acc" data-new aria-label="Yeni kart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="scroll" id="mapBody"></div>
        <div class="zc" id="zc"><button id="zOut" aria-label="Uzaklaştır">−</button><span class="pct" id="zPct">100%</span><button id="zIn" aria-label="Yakınlaştır">+</button><button id="zFit" aria-label="Tümünü sığdır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
        <div class="sv" id="sv"><div class="sv-msg" id="svMsg" role="status" aria-live="polite"><span id="svTxt"></span></div><button type="button" class="sv-btn" id="svBtn" aria-label="Haritayı kaydet"><svg class="i-no" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L3 19.5h18z"/><path d="M12 10v4.5M12 17.5h.01"/></svg><svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg></button></div>
        <button class="icon-btn sm mfx" id="mapFullExit" aria-label="Tam ekrandan çık"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
        <div class="rbar" id="rbar"><span class="rb-t"><b>Sıralama açık</b><small>Kartı tutup başka kartın üstüne sürükle: yerleri anında değişir, bağlar otomatik düzelir</small></span><button class="act s" id="rbUndo" disabled>Geri al</button><button class="act" id="rbDone">Bitti</button></div>
        <div class="rbar pkbar" id="pkbar"><span class="rb-t"><b>Devam edeceği kartı seç</b><small>Haritada gezinip bir karta dokun</small></span><button class="act" id="pkCancel">Vazgeç</button></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Kartlar">
        <div class="top"><div class="ttl"><h1>Kartlar</h1><div class="sub" id="subCards"></div></div>
          <button class="icon-btn acc" data-new aria-label="Yeni kart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="scroll" id="cardsBody"></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Omurga">
        <div class="top"><div class="ttl"><h1>Omurga</h1><div class="sub" id="subSpine"></div></div>
          <button class="icon-btn acc" id="addBeatTop" aria-label="Durak ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="scroll" id="spineBody"></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Oyun">
        <div class="top"><div class="ttl"><h1>Oyun</h1><div class="sub" id="subGame"></div></div></div>
        <div class="scroll" id="gameBody"></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Tasarım">
        <div class="top"><div class="ttl"><h1>Tasarım</h1><div class="sub" id="subArt"></div></div>
          <button class="icon-btn acc" data-io="arts" aria-label="Çizimleri oyun dosyasından al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg></button></div>
        <div class="scroll" id="artBody"></div>
      </div>
    </div>
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sayfalar">
      <i class="tb-ind" id="tbInd"></i>
      <button type="button" class="tb on" role="tab" data-t="0" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M11 8L7 15.6M13 8l4 7.6"/></svg><span>Harita</span></button>
      <button type="button" class="tb" role="tab" data-t="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="3.5" width="11" height="17" rx="3"/><path d="M3 7v10M21 7v10"/></svg><span>Kartlar</span></button>
      <button type="button" class="tb" role="tab" data-t="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 5h12l-3 3.5 3 3.5H6"/></svg><span>Omurga</span></button>
      <button type="button" class="tb" role="tab" data-t="3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg><span>Oyun</span></button>
      <button type="button" class="tb" role="tab" data-t="4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="9" cy="9.5" r="1.7"/><path d="M4 17l5-4.5 3.5 3L15 13l5 4.5"/></svg><span>Tasarım</span></button>
    </nav>
  </section>

  <!-- Kart sayfası: hero + gövde (grup sayfası tarzı) -->
  <section class="view" id="cardPage" aria-label="Kart">
    <div class="scroll" id="cpScroll"><div class="hero" id="cpHero"></div><div class="gbody" id="cpBody"></div></div>
    <div class="ghead" id="cpHead"><span id="cpHeadT"></span></div>
    <button class="icon-btn fbtn" id="cpBack" style="left:20px" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon-btn fbtn" id="cpEdit" style="right:20px" aria-label="Kartı düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></svg></button>
  </section>

  <!-- Kart düzenleyici: tam ekran sayfa -->
  <section class="view" id="cardForm" aria-label="Kart düzenle">
    <div class="top">
      <button class="icon-btn" id="cfBack" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><h1 id="cfTitle"></h1><div class="sub" id="cfSub"></div></div>
      <div class="wz-prog" id="cfProg"><span class="wz-seg"><i></i></span><span class="wz-seg"><i></i></span><span class="wz-seg"><i></i></span><span class="wz-seg"><i></i></span></div><span class="wz-step" id="cfStep"></span>
    </div>
    <div class="scroll" id="cfBody"></div>
    <div class="form-foot">
      <div class="wz-row"><button class="wz-bk off" id="cfPrev" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button class="primary" id="cfDone">Bitti</button></div>
      <button class="ghost" id="cfDel">Kartı sil</button>
    </div>
  </section>

  <!-- Haritalar: tam ekran liste -->
  <section class="view" id="mapsPage" aria-label="Haritalar">
    <div class="top">
      <button class="icon-btn" id="mpBack" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><h1>Haritalar</h1><div class="sub" id="mpSub"></div></div>
      <button class="icon-btn acc" id="mpNew" aria-label="Yeni harita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="scroll" id="mpBody"></div>
  </section>

  <!-- Harita kartı: oyundaki gibi kaydırılabilen kart sayfası -->
  <section class="view" id="gamePage" aria-label="Kart">
    <div class="gp-stage" id="gpStage">
      <div class="gp-side gp-l" id="gpSL"><div class="gp-opt" id="gpOL"></div></div>
      <div class="gp-side gp-r" id="gpSR"><div class="gp-opt" id="gpOR"></div></div>
      <div class="gp-meta" id="gpMeta"><span class="gp-spk" id="gpSpk"></span><div class="gp-txt" id="gpTxt"></div></div>
      <div class="gp-deck"><i></i><i></i><i></i></div>
      <div class="gp-card" id="gpCard"><div class="gp-art" id="gpArt"></div></div>
    </div>
    <div class="gp-top">
      <button class="icon-btn" id="gpBack" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="gp-id" id="gpId"></div>
      <button class="icon-btn" id="gpEdit" aria-label="Kartı düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></svg></button>
    </div>
  </section>

  <div class="sc" id="scHost"></div>

  <!-- Sıradaki kartlar seçici -->
  <div class="sht" id="nxSheet">
    <div class="sht-card">
      <h2>Sıradaki kartlar</h2>
      <p class="ssub" id="nxSub"></p>
      <div class="sht-list" id="nxList"></div>
      <button class="primary sec" id="nxDone">Tamam</button>
    </div>
  </div>

  <!-- Seçim etkileri paneli -->
  <div class="sht" id="efSheet">
    <div class="sht-card">
      <h2 id="efT"></h2>
      <p class="ssub" id="efSub"></p>
      <div class="sht-list" id="efList" style="margin:0 0 8px"></div>
      <button class="primary sec" id="efDone">Tamam</button>
    </div>
  </div>

  <!-- Harita: karta basılı tutunca açılan panel -->
  <div class="sht" id="ndSheet">
    <div class="sht-card">
      <h2 id="ndT"></h2>
      <p class="ssub" id="ndSub"></p>
      <div class="sht-list" id="ndList"></div>
    </div>
  </div>

  <div class="sht" id="pkSheet"><div class="sht-card">
    <h2>Çizim seç</h2><p class="ssub" id="pkSub"></p>
    <div class="sht-list" id="pkList"></div>
    <button class="primary sec" id="pkDone">Vazgeç</button>
  </div></div>

  <div class="sht" id="arSheet"><div class="sht-card">
    <div class="sht-list" style="margin:0">
      <div class="aprev" id="arPrev"></div>
      <div class="fsec" style="margin-bottom:14px"><div class="fcard"><div class="fcell"><small>Çizim adı</small><input class="finput" id="arName" placeholder="Örn. Memur" autocomplete="off" enterkeyhint="done"></div></div></div>
      <div class="fsec" style="margin-bottom:8px"><div class="fcard">
        <button class="frow lnk lead" id="arCopy"><span class="in-ic" data-ic="copy"></span><span class="fl">SVG kodunu kopyala<small>Çizimin birebir kodu</small></span></button>
        <button class="frow lnk lead" id="arSave"><span class="in-ic" data-ic="down"></span><span class="fl">SVG dosyası olarak indir<small>Başka yerde kullanmak için</small></span></button>
        <button class="frow lnk lead danger" id="arDel"><span class="in-ic" data-ic="trash"></span><span class="fl">Çizimi sil<small>Yalnızca editörden kalkar, oyun dosyan etkilenmez</small></span></button>
      </div></div>
    </div>
    <button class="primary sec" id="arDone">Tamam</button>
  </div></div>

  <div class="sht" id="wnSheet"><div class="sht-card"><h2>Durum</h2><p class="ssub" id="wnSub"></p><div class="sht-list" id="wnList"></div><button class="primary sec" id="wnDone">Tamam</button></div></div>

  <!-- Düzeltme paneli: kartları bağla -->
  <div class="sht" id="fxSheet">
    <div class="sht-card">
      <h2 id="fxT"></h2>
      <p class="ssub" id="fxSub"></p>
      <div class="sht-list" id="fxList"></div>
      <button class="primary sec" id="fxDone">Tamam</button>
    </div>
  </div>

  <!-- Onay paneli -->
  <div class="sht" id="dlg">
    <div class="sht-card">
      <h2 id="dlgT"></h2>
      <p class="ssub" id="dlgP"></p>
      <div class="dbtns"><button class="dbtn ok" id="dlgOk"></button><button class="dbtn no" id="dlgNo">Vazgeç</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept=".html,text/html" hidden>
</div>
<script>
var STATS={faith:'İnanç',people:'Halk',army:'Ordu',wealth:'Servet'};
var ARCS={ana:['Ana hikaye','#e0503a'],yan:['Yan görev','#4f86b8'],dal:['Dal','#3f9a7c']};
var KEY='hikaye-masasi-v1';
var $=function(s){return document.querySelector(s)};
var I={
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  sort:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V4M7 4L4 7M7 4l3 3M17 4v16M17 20l-3-3M17 20l3-3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',

function fitT(){
  var b=$('#mapBody'),vw=b.clientWidth,vh=b.clientHeight,L=Lc,mx=16,mt=80,mb=72;
  var k=Math.max(KMIN,Math.min(1.2,Math.min((vw-2*mx)/L.w,(vh-mt-mb)/L.h)));
  return{k:k,x:(vw-L.w*k)/2,y:mt+(vh-mt-mb-L.h*k)/2};
}
function viewInit(){
  var b=$('#mapBody'),vw=b.clientWidth,vh=b.clientHeight;
  if(V.init||!Lc||!vw||!vh)return;
  var f=fitT();
  if(f.k>=.5){V.k=f.k;V.x=f.x;V.y=f.y}
  else{var p=Lc.pos[S.cards[0].id],k=.6;V.k=k;V.x=16-p.x*k;V.y=vh/2-(p.y+NH/2)*k}
  T.x=V.x;T.y=V.y;T.k=V.k;V.init=1;
}
function applyView(){
  var w=$('#world'),b=$('#mapBody');
  if(w)w.style.transform='translate('+V.x+'px,'+V.y+'px) scale('+V.k+')';
  var z=V.k<.5?0:V.k<.85?1:2;if(b.dataset.z!=z)b.dataset.z=z;
  var p=$('#zPct');if(p)p.textContent=Math.round(V.k*100)+'%';
}
function vTick(){
  var a=.2,dk=T.k-V.k,dx=T.x-V.x,dy=T.y-V.y;
  if(Math.abs(dk)<.0007&&Math.abs(dx)<.3&&Math.abs(dy)<.3){V.k=T.k;V.x=T.x;V.y=T.y;applyView();vAnim=0;return}
  V.k+=dk*a;V.x+=dx*a;V.y+=dy*a;applyView();vAnim=requestAnimationFrame(vTick);
}
function vGo(){if(!vAnim)vAnim=requestAnimationFrame(vTick)}
function vSet(){T.x=V.x;T.y=V.y;T.k=V.k;if(vAnim){cancelAnimationFrame(vAnim);vAnim=0}}
function zoomAt(f,cx,cy){
  var wx=(cx-V.x)/V.k,wy=(cy-V.y)/V.k,k=Math.max(KMIN,Math.min(KMAX,T.k*f));
  T.k=k;T.x=cx-wx*k;T.y=cy-wy*k;vGo();
}
function fitView(){if(!Lc)return;var f=fitT();T.k=f.k;T.x=f.x;T.y=f.y;vGo()}

function runScene(host, c, srcOf, done) {
  var pages = (c.pages && c.pages.length) ? c.pages : [{ text: c.text || '' }];
  var i = -1, ready = false, over = false, tm = [], typeT = 0, full = '', curArt = null, curEl = null;
  host.innerHTML = '<div class="sc-bg"></div><div class="sc-txt"></div><div class="sc-hint">Devam etmek için dokun</div><button type="button" class="sc-skip">Atla</button>';
  var bg = host.querySelector('.sc-bg'), tx = host.querySelector('.sc-txt'), hint = host.querySelector('.sc-hint'), skip = host.querySelector('.sc-skip');
  function later(f, ms) { tm.push(setTimeout(f, ms)); }
  function clear() { tm.forEach(clearTimeout); tm = []; clearInterval(typeT); }
  function motion(el, anim) {
    if (!el.animate || anim === 'still') return;
    var a = anim === 'pan' ? [{ transform: 'scale(1.12) translateX(3%)' }, { transform: 'scale(1.12) translateX(-3%)' }]
                           : [{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }];
    if (el._an) el._an.cancel();
    el._an = el.animate(a, { duration: 9000, easing: 'ease-out', fill: 'forwards' });
  }
  function showArt(pg) {
    var src = pg.art ? srcOf(pg.art) : null;
    if (pg.art && pg.art === curArt && curEl) return;              // aynı görsel: kesintisiz devam eder
    var old = curEl; curArt = pg.art || null; curEl = null;
    if (old) { old.style.opacity = 0; setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1200); }
    if (!src) return;
    var el = document.createElement('div');
    el.className = 'sc-art'; el.style.backgroundImage = 'url("' + src + '")';
    bg.appendChild(el); curEl = el;
    void el.offsetWidth; el.style.opacity = 1; motion(el, pg.anim || 'zoom');
  }
  function settle() { ready = true; later(function () { hint.classList.add('on'); }, 600); }
  function showNow() {                                             // yazıyı hemen tamamla
    clear(); tx.textContent = full; tx.classList.add('in'); settle();
  }
  function showText(pg) {
    full = pg.text || ''; ready = false;
    tx.classList.remove('in'); tx.classList.toggle('mid', !pg.art); hint.classList.remove('on'); tx.textContent = '';
    later(function () {
      if (!full) { settle(); return; }
      if (pg.fx === 'type') {
        tx.classList.add('in'); var n = 0;
        typeT = setInterval(function () {
          n++; tx.textContent = full.slice(0, n);
          if (n >= full.length) { clearInterval(typeT); settle(); }
        }, 32);
      } else { tx.textContent = full; void tx.offsetWidth; tx.classList.add('in'); settle(); }
    }, 700);
  }
  function go() { var pg = pages[i]; showArt(pg); showText(pg); }
  function next() {
    if (over) return;
    i++;
    if (i >= pages.length) return end();
    if (i > 0) { tx.classList.remove('in'); hint.classList.remove('on'); ready = false; later(go, 450); } else go();
  }
  function end() {
    if (over) return; over = true; clear();
    host.classList.remove('on');
    setTimeout(function () { if (!host.classList.contains('on')) host.innerHTML = ''; }, 700);
    if (done) done();
  }
  host.onclick = function (e) { e.stopPropagation(); if (e.target === skip) return; if (!ready) showNow(); else next(); };
  skip.onclick = function (e) { e.stopPropagation(); end(); };
  host.classList.add('on');
  next();
  return { stop: function () { over = true; clear(); host.classList.remove('on'); host.innerHTML = ''; } };
}

  var r=edSel();

  if(!r.collapsed){

var EASE='cubic-bezier(.32,.72,0,1)',N=5;

var MAPS_KEY='hikaye-haritalar-v1';
var MP=(function(){try{var m=JSON.parse(localStorage.getItem(MAPS_KEY));if(m&&Array.isArray(m.list))return m}catch(e){}return{list:[]}})();
function mpStore(){try{localStorage.setItem(MAPS_KEY,JSON.stringify(MP));return true}catch(e){return false}}
function mpSnap(){return JSON.stringify({n:S.mapName||'',c:S.cards,b:S.beats,e:S.ending,x:S.ends||{}})}
function mpFind(id){for(var i=0;i<MP.list.length;i++)if(MP.list[i].id===id)return MP.list[i];return null}
function mpIsSaved(){var m=S.mapId&&mpFind(S.mapId);return !!m&&m.d===mpSnap()}
function mpDirty(){return !mpIsSaved()&&(S.cards.length>0||!!S.mapId)}
function mpDate(t){try{return new Date(t).toLocaleString('tr-TR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}catch(e){return''}}

/* kaydet: yeni haritaysa listeye ekler, kayıtlıysa üstüne yazar */
function mpSave(){
  var prev=S.mapId,e=prev&&mpFind(prev),isNew=!e,old=e&&{name:e.name,t:e.t,n:e.n,d:e.d};
  if(isNew){S.mapId='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);e={id:S.mapId};MP.list.unshift(e)}
  e.name=S.mapName||'Adsız harita';e.t=Date.now();e.n=S.cards.length;e.d=mpSnap();
  if(!mpStore()){
    if(isNew){MP.list.shift();S.mapId=prev}else{e.name=old.name;e.t=old.t;e.n=old.n;e.d=old.d}
    return false;
  }
  save();renderGame();if(mpOpen)renderMaps();
  return true;
}

var svTimers=[];
function svLater(f,ms){svTimers.push(setTimeout(f,ms))}
function svSet(text,ok){$('#svTxt').textContent=text;$('#svMsg').classList.toggle('ok',!!ok)}
function svPop(){var b=$('#svBtn');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
$('#svBtn').addEventListener('click',function(){
  svTimers.forEach(clearTimeout);svTimers=[];
  var m=$('#svMsg'),was=mpIsSaved();
  function first(){svSet(was?'Kaydedildi':'Kayıt yapılmadı',was);m.classList.remove('sw');m.classList.add('on')}
  function hide(){m.classList.remove('on')}
  /* yazı zaten görünüyorsa önce yumuşakça sönüp yenisi gelir */
  if(m.classList.contains('on')){m.classList.add('sw');svLater(first,180)}else first();
  if(was){
    /* kayıtlıydı: yazı göründükten sonra kayıt tekrar yapılır */
    svLater(function(){
      var ok=mpSave();mpPaint();
      if(!ok){m.classList.add('sw');svLater(function(){svSet('Kaydedilemedi',false);m.classList.remove('sw')},180)}
    },700);
    svLater(hide,2100);
  }else{
    /* kayıtlı değildi: "Kayıt yapılmadı" görünür, ardından kayıt yapılıp "Kaydedildi"ye dönüşür */
    svLater(function(){
      m.classList.add('sw');
      svLater(function(){
        var ok=mpSave();mpPaint();

});
mpPaint();


/* ---------- harita kartı sayfası: oyundaki kart mekaniği ----------
   Kart parmağı takip eder; seçim bölgesinde bırakılırsa o cevabın devam kartına geçilir.
   Bölgeye girmeden bırakılırsa kart merkeze döner. Devam kartı yoksa kart geri döner. */
var gpOpen=false,gpPushed=false,gpSkip=0;
var GP=(function(){
  var stage=$('#gpStage'),card=$('#gpCard'),art=$('#gpArt'),spk=$('#gpSpk'),txt=$('#gpTxt');
  var sideL=$('#gpSL'),sideR=$('#gpSR'),optL=$('#gpOL'),optR=$('#gpOR');
  var x=0,y=0,vx=0,vy=0,sc=1,o=0,mode='idle',t0=0,dir=0,zone=105,pl=0,pr=0;
  var dragging=false,ox=0,oy=0,trail=[],raf=0,last=0,pending=null,locked=false,nextL=null,nextR=null,curId=null,isTalk=false,canL=true,canR=true,sig='';

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function smooth(v){v=clamp(v,0,1);return v*v*(3-2*v)}
  function calcZone(){zone=clamp(window.innerWidth*.27,90,130)}
  function prog(px){return smooth((Math.abs(px)-6)/(zone-6))}

  function draw(){
    var r=clamp(x/280,-1.6,1.6)*8;
    card.style.transform='translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,0) rotate('+r.toFixed(3)+'deg) scale('+sc.toFixed(4)+')';
    card.style.opacity=o.toFixed(3);
    sideL.style.opacity=pl.toFixed(3);sideR.style.opacity=pr.toFixed(3);
    var lo=clamp((pl-.15)/.6,0,1),ro=clamp((pr-.15)/.6,0,1);
    optL.style.opacity=lo.toFixed(3);optL.style.transform='translate3d('+(-(1-lo)*26).toFixed(1)+'px,0,0)';
    optR.style.opacity=ro.toFixed(3);optR.style.transform='translate3d('+((1-ro)*26).toFixed(1)+'px,0,0)';
  }
  function applyLabels(){
    if(nextL!==null&&pl<.15){optL.textContent=nextL;nextL=null}
    if(nextR!==null&&pr<.15){optR.textContent=nextR;nextR=null}
  }
  function paint(c){
    var ar=c.art?artById(c.art):null,col=arcOf(c)[1];
    art.innerHTML=ar?'<img alt="" draggable="false" src="'+artSrc(ar)+'">':'<div class="gp-ph" style="background:color-mix(in srgb,'+col+' 38%,#000)"><b>'+esc(c.id)+'</b></div>';
    spk.textContent=c.speaker||'';
    txt.textContent=plain(c.text)||'Bu kartın metni henüz yok.';
    $('#gpId').textContent=c.id+' · '+arcOf(c)[0];
  }
  function sigOf(c){var ar=c.art?artById(c.art):null;return JSON.stringify([c.id,c.speaker,c.text,c.art,ar?ar.svg.length:0,c.arc,c.talk,lab(c.left),lab(c.right)])}
  function renderCard(c){
    curId=c.id;sig=sigOf(c);var so=solo(c);canL=!so||so==='left';canR=!so||so==='right';paint(c);
    isTalk=!!c.talk;nextL=isTalk?'':(c.left?(c.left.label||''):'');nextR=isTalk?'':(c.right?(c.right.label||''):'');
    applyLabels();
  }
  function startEnter(){x=y=vx=vy=0;sc=.95;o=0;mode='enter';t0=performance.now();locked=true;kick()}
  function present(c){
    if(c.scene){
      curId=c.id;sig=sigOf(c);locked=true;mode='idle';o=0;draw();$('#gpId').textContent=c.id+' · Ara sahne';
      playScenePreview(c,function(){locked=false;var nx=nextOf('left');if(nx)present(nx);else toast('Bu sahnenin devamı yok')});
      return;
    }
    renderCard(c);startEnter();
  }
  function beginNext(){
    if(pending){var c=pending;pending=null;present(c)}
    else mode='idle';
  }
  function approach(cur,target,dt){var tau=target>cur?.08:.11;return cur+(target-cur)*(1-Math.exp(-dt/tau))}

  function tick(t){
    var dt=last?clamp((t-last)/1000,.001,.05):1/60;last=t;
    var busy=false,n=4,h=dt/n,i;
    if(mode==='drag'){busy=true}
    else if(mode==='settle'){
      var k=120,c=2*Math.sqrt(k);
      for(i=0;i<n;i++){vx+=(-k*x-c*vx)*h;vy+=(-k*y-c*vy)*h;x+=vx*h;y+=vy*h}
      if(Math.abs(x)<.1&&Math.abs(y)<.1&&Math.abs(vx)<2&&Math.abs(vy)<2){x=y=vx=vy=0;mode='idle'}else busy=true;
    }else if(mode==='exit'){
      var ke=70,ce=2*Math.sqrt(ke)*.9,far=dir*(window.innerWidth*.5+card.offsetWidth+80);
      for(i=0;i<n;i++){vx+=(ke*(far-x)-ce*vx)*h;vy-=vy*3*h;x+=vx*h;y+=vy*h}
      o=1-smooth((Math.abs(x)-zone)/(window.innerWidth*.5));
      if(o<=.01){o=0;mode='gap';t0=t}
      busy=true;
    }else if(mode==='gap'){
      if(t-t0>260)beginNext();else busy=true;
    }else if(mode==='enter'){
      var kk=clamp((t-t0)/560,0,1),e=1-Math.pow(1-kk,3);
      o=e;sc=.95+.05*e;y=16*(1-e);
      if(kk>=1){mode='idle';locked=false;o=1;sc=1;y=0}else busy=true;
    }
    var tl=0,tr=0,live=mode==='drag'||mode==='settle';
    if(!isTalk&&(live||mode==='exit')){var p=prog(x);if(x>0){if(canR)tr=p}else if(canL)tl=p}
    pl=approach(pl,tl,dt);pr=approach(pr,tr,dt);
    if(Math.abs(pl-tl)>.002||Math.abs(pr-tr)>.002)busy=true;else{pl=tl;pr=tr}
    applyLabels();draw();
    if(busy)raf=requestAnimationFrame(tick);else{raf=0;last=0}
  }
  function kick(){if(!raf){last=0;raf=requestAnimationFrame(tick)}}

  function nextOf(side){
    var c=byId(curId);if(!c)return null;
    var ids=(c.talk?(c.left&&c.left.next):(c[side]&&c[side].next))||[];
    for(var i=0;i<ids.length;i++){var n=byId(ids[i]);if(n)return n}
    return null;
  }
  function commit(name,e,nx){
    dragging=false;card.classList.remove('dragging');
    try{card.releasePointerCapture(e.pointerId)}catch(_){}
    var a=trail[0],b=trail[trail.length-1],dt=(b.t-a.t)/1000;
    vx=dt>.01?clamp((b.x-a.x)/dt,-1800,1800):0;
    vy=dt>.01?clamp((b.y-a.y)/dt,-1800,1800):0;
    dir=name==='right'?1:-1;locked=true;mode='exit';pending=nx;
    if(navigator.vibrate){try{navigator.vibrate(8)}catch(_){}}
    kick();
  }
  card.addEventListener('pointerdown',function(e){
    e.stopPropagation();
    if(locked||!curId||(mode!=='idle'&&mode!=='settle'))return;
    mode='drag';dragging=true;card.classList.add('dragging');card.setPointerCapture(e.pointerId);
    ox=e.clientX-x;oy=e.clientY-y;trail=[{x:e.clientX,y:e.clientY,t:e.timeStamp}];kick();
  });
  card.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var nx=e.clientX-ox;
    if((nx<0&&!canL)||(nx>0&&!canR))nx=(nx<0?-1:1)*26*(1-Math.exp(-Math.abs(nx)/70));   /* kapalı yön: kart direnç gösterir */
    x=nx;y=e.clientY-oy;
    trail.push({x:e.clientX,y:e.clientY,t:e.timeStamp});
    while(trail.length>2&&e.timeStamp-trail[0].t>80)trail.shift();
  });
  function release(e){
    if(!dragging)return;
    if(e.type==='pointerup'&&Math.abs(x)>=zone&&(x>0?canR:canL)){
      var side=x>0?'right':'left',nx=nextOf(side);
      if(nx){commit(side,e,nx);return}
      var cc=byId(curId);
      toast(cc&&S.ends&&S.ends[cc.id]?'Hikâyenin sonu':cc&&cc.talk?'Bu kartın devamı yok':'Bu cevabın devam kartı yok');
    }
    dragging=false;card.classList.remove('dragging');
    try{card.releasePointerCapture(e.pointerId)}catch(_){}
    var a=trail[0],b=trail[trail.length-1],dt=(b.t-a.t)/1000;vx=vy=0;
    if(dt>.01&&e.timeStamp-b.t<60){vx=clamp((b.x-a.x)/dt,-1800,1800);vy=clamp((b.y-a.y)/dt,-1800,1800)}
    mode='settle';kick();
  }
  card.addEventListener('pointerup',release);
  card.addEventListener('pointercancel',release);
  card.addEventListener('click',function(e){e.stopPropagation()});
  card.addEventListener('dragstart',function(e){e.preventDefault()});
  card.addEventListener('contextmenu',function(e){e.preventDefault()});

  function reset(){
    if(raf){cancelAnimationFrame(raf);raf=0}
    last=0;x=y=vx=vy=0;sc=1;o=0;pl=pr=0;mode='idle';locked=false;dragging=false;pending=null;
    nextL=nextR=null;canL=canR=true;sig='';optL.textContent='';optR.textContent='';card.classList.remove('dragging');draw();
  }
  window.addEventListener('resize',calcZone);calcZone();
  return{
    show:function(id){var c=byId(id);if(!c)return;reset();present(c)},
    reset:reset,
    id:function(){return curId},
    /* kart düzenlenince metin, çizim ve cevaplar yerinde güncellenir */
    rerender:function(){
      var c=byId(curId);if(!c)return closeGame();
      if(c.scene)return;
      if(mode==='idle'&&!locked&&sigOf(c)!==sig)renderCard(c);   /* içerik değişmediyse yeniden çizme: titreme olmasın */
    }
  };
})();
function openGame(id){
  if(gpOpen||formOpen||!byId(id))return;
  gpOpen=true;var v=$('#gamePage');v.inert=false;$('#home').inert=true;
  GP.show(id);void v.offsetWidth;v.classList.add('open');
  try{history.pushState({g:1},'');gpPushed=true}catch(e){gpPushed=false}
}
function doCloseGame(){
  if(!gpOpen)return;gpOpen=false;
  if(scRunE){scRunE.stop();scRunE=null}
  $('#gamePage').classList.remove('open');$('#home').inert=false;
  setTimeout(function(){if(!gpOpen){$('#gamePage').inert=true;GP.reset()}},400);
}
function closeGame(){
  if(!gpOpen)return;
  var p=gpPushed;gpPushed=false;doCloseGame();
  if(p){gpSkip=1;try{history.back()}catch(e){gpSkip=0}}
}
window.addEventListener('popstate',function(e){
  if(gpSkip){gpSkip=0;return}
  /* kart düzenleyici bu sayfanın üstündeyken geri tuşu yalnızca düzenleyiciyi kapatır */
  if(gpOpen&&!(e.state&&e.state.g)){gpPushed=false;doCloseGame()}
});
$('#gpBack').addEventListener('click',closeGame);
$('#gpEdit').addEventListener('click',function(){var id=GP.id();if(id)openForm(id)});

$('#cardForm').inert=true;
$('#mapsPage').inert=true;
$('#gamePage').inert=true;
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
refresh();tabGo(0,true);tabPaint(0,false);
</script>
</body>
</html>
