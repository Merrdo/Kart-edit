<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Akan Yazı Editör</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<script>
/* İlk çizimden önce gerçek ekran yüksekliğini ve kurulu/tarayıcı modunu belirle */
(function () {
  var d = document.documentElement, w = window, n = w.navigator;
  var st = n.standalone === true || (w.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  var h = w.innerHeight;
  if (st) h = Math.max(h, w.innerHeight >= w.innerWidth ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width));
  d.style.setProperty('--full-h', h + 'px');
  if (!st) d.classList.add('browser');
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yazı Editör">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#000;--surface:#0f0f10;--surface2:#1b1b1d;--line:rgba(255,255,255,.09);
  --ink:#f7f7f5;--dim:#8e8e93;--ph:#55555a;
  --accent:#e0503a;--acc-rgb:224,80,58;--accent-ink:#fff;--accent-soft:rgba(224,80,58,.16);
  --blue:#5b9bd5;--green:#3f9a7c;--amber:#e0a43a;--danger:#ff5a4d;
  --r:20px;--ease:cubic-bezier(.32,.72,0,1);--serif:Georgia,'Times New Roman',serif;
  --pt:max(env(safe-area-inset-top,0px),20px);
  --pb:max(env(safe-area-inset-bottom,0px),18px);
  --tbh:calc(54px + var(--pb));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:var(--full-h,100%);min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased}
.stage{position:absolute;top:0;left:0;width:100%;height:var(--full-h,100%);overflow:hidden;overflow:clip}
html.ready .stage{transition:height .32s cubic-bezier(.22,.9,.24,1)}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s var(--ease),background .2s,color .2s}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
b{font-weight:700;font-variant-numeric:tabular-nums}

/* ---- görünümler ---- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;overflow:clip}
.scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 20px 28px}
.top{padding:var(--pt) 20px 14px;display:flex;align-items:center;gap:12px;flex:none}
.ttl{flex:1;min-width:0}
.top h1{font-size:1.7rem;letter-spacing:-.03em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--dim);font-size:.85rem;margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.icon-btn:active{transform:scale(.9);background:var(--surface2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.acc{background:var(--accent);color:var(--accent-ink)}
.primary{width:100%;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 28px -12px rgba(var(--acc-rgb),.55)}
.primary:active{transform:scale(.975);filter:brightness(.92)}
.primary.sec{background:var(--surface2);color:var(--ink);box-shadow:none}
.primary svg{width:18px;height:18px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}

/* ---- ana kabuk ---- */
#home .tpages{position:absolute;left:0;top:0;bottom:var(--tbh);width:400%;display:flex;will-change:transform}
.tpage{position:relative;flex:0 0 25%;min-width:0;display:flex;flex-direction:column;overflow:hidden;overflow:clip;backface-visibility:hidden}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tbh);z-index:6;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 10px var(--pb);padding-bottom:calc(var(--pb) - 8px);background:var(--bg);border-top:1px solid var(--line)}
html.kbd .tabbar{opacity:0;pointer-events:none;transition:opacity .2s}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim)}
html.ready .tb{transition:color .35s var(--ease)}
.tb svg{width:25px;height:25px;transition:transform .45s var(--ease)}
.tb span{font-size:.68rem;font-weight:650}
.tb:active svg{transform:scale(.88)}
.tb.on{color:var(--accent)}
.tb.on svg{transform:translateY(-1px)}
.tb-ind{position:absolute;top:-1px;left:0;width:calc((100% - 20px)/4);height:2px;margin-left:10px;pointer-events:none;will-change:transform}
.tb-ind::after{content:"";display:block;width:26px;height:2px;margin:0 auto;border-radius:0 0 2px 2px;background:var(--accent)}

/* ---- liste kartları ---- */
.card{width:100%;text-align:left;display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card:active{transform:scale(.98);background:var(--surface2)}
.tile{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent)}
.card .bd{flex:1;min-width:0;padding-top:1px}
.card .name{font-size:.82rem;color:var(--dim);font-weight:600;display:flex;gap:8px;align-items:center}
.card .name i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.card p{font-family:var(--serif);font-size:1.02rem;line-height:1.38;margin:4px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p.none{font-family:inherit;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--dim);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.l{color:#8fb4d6}.chip.r{color:#ec8a74}
.filters{display:flex;gap:8px;margin:0 -20px 14px;padding:0 20px;overflow-x:auto;touch-action:pan-x}
.fl-chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.88rem;color:var(--dim)}
.fl-chip.on{background:var(--accent-soft);border-color:rgba(var(--acc-rgb),.4);color:var(--accent)}
.empty{text-align:center;color:var(--dim);padding:10vh 32px 0;line-height:1.5;font-size:.95rem}
.empty h2{color:var(--ink);font-size:1.2rem;letter-spacing:-.02em;margin-bottom:6px}

/* ---- bölüm / form satırları ---- */
.fsec{margin-bottom:26px}
.fcap{color:var(--dim);font-size:.76rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:0 4px 10px}
.fhint{color:var(--dim);font-size:.82rem;line-height:1.45;padding:10px 4px 0}
.fcard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s,box-shadow .3s}
.fcard>*+*{border-top:1px solid var(--line)}
.fcard:focus-within{border-color:rgba(var(--acc-rgb),.45)}
.finput{display:block;width:100%;min-width:0;background:none;border:0;outline:0;resize:none;padding:16px 18px;font-size:1.05rem;line-height:1.45;caret-color:var(--accent)}
.finput::placeholder{color:var(--ph)}
textarea.finput{min-height:120px;font-family:var(--serif);font-size:1.05rem}
.fcell{padding:12px 18px 6px}
.fcell small{display:block;color:var(--dim);font-size:.74rem;font-weight:650;letter-spacing:.02em}
.fcell .finput{padding:6px 0 10px;font-size:1.02rem}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 12px 10px 18px;width:100%;text-align:left}
.frow.seg-row{min-height:0;padding:8px}
.fl{font-weight:600;font-size:1rem;letter-spacing:-.01em;min-width:0}
.fl small{display:block;color:var(--dim);font-size:.78rem;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
.frow.lnk:active{background:var(--surface2)}
.chev svg{width:18px;height:18px;color:var(--dim);display:block}
.in-ic{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--accent);margin-right:2px}
.in-ic svg{width:24px;height:24px}
.frow.lead{justify-content:flex-start;gap:12px}
.frow.lead .fl{flex:1}
.frow.lead .fl small{white-space:normal;max-width:none}
.warnrow small{color:var(--amber)}
.seg{position:relative;width:100%;display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--bg);border-radius:13px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,3));background:var(--surface2);border-radius:10px;transform:translateX(calc(var(--k,0)*100%));transition:transform .35s var(--ease)}
.seg button{position:relative;z-index:1;height:40px;font-weight:600;font-size:.9rem;color:var(--dim)}
.seg button.on{color:var(--ink)}
.stepper{display:flex;align-items:center;flex:none}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--surface2);font-size:1.3rem;line-height:1;display:grid;place-items:center}
.stepper button:active{background:var(--bg);transform:scale(.9)}
.stepper .val{min-width:58px;text-align:center;font-size:1.05rem}
.stepper .val b.p{color:#7ccf9d}.stepper .val b.n{color:#ec8a74}.stepper .val b.z{color:var(--dim);font-weight:600}
.sw-ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;color:transparent}
.sw-ck svg{width:14px;height:14px}
.beat.done .sw-ck{background:var(--accent);border-color:var(--accent);color:#fff}
.beat.done input{color:var(--dim);text-decoration:line-through}
.beat input{flex:1;min-width:0;background:none;border:0;outline:0;padding:8px 0;font-size:1.02rem;caret-color:var(--accent)}
.beat .x{width:36px;height:36px;border-radius:50%;color:var(--dim);display:grid;place-items:center;flex:none}
.beat .x svg{width:16px;height:16px}
.beat{padding-left:14px}
.prevbox{padding:14px 18px 16px}
.prevbox small{display:block;color:var(--dim);font-size:.74rem;font-weight:650;margin-bottom:6px}
.prev{font-family:var(--serif);font-size:1.1rem;line-height:1.5;color:rgba(247,247,245,.92);min-height:1.5em}
mark.hl{color:var(--ink);padding:.12em 7px .1em 0;margin:0 -7px 0 0;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;--c:rgba(224,80,58,.4);background:linear-gradient(var(--c),var(--c)) no-repeat 0 0/100% 100%;box-shadow:-7px 0 0 0 var(--c)}
.seedtxt{font-family:var(--serif);font-size:1.02rem}

/* ---- harita ---- */
.stat{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:14px;color:var(--dim);font-size:.9rem;line-height:1.4}
.stat b{color:var(--amber)}
.stat.ok b{color:#7ccf9d}
.legend{display:flex;gap:16px;color:var(--dim);font-size:.8rem;font-weight:600;margin:2px 4px 16px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.map{position:relative}
.map svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map path{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.75}
.map.anim path{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .9s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}}
.nd{position:absolute;height:50px;border-radius:15px;background:var(--surface2);border:1.5px solid var(--line);padding:6px 10px;text-align:left;overflow:hidden}
.map.anim .nd{animation:rise .5s var(--ease) both}
.nd:active{transform:scale(.96)}
.nd b{display:block;font-size:.8rem;white-space:nowrap}
.nd span{display:block;font-size:.72rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.nd.bad{border-color:var(--amber);border-style:dashed}

/* ---- kart formu (tam ekran sayfa) ---- */
#cardForm{z-index:12;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
#cardForm.open{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
#cardForm.drag{transition:none}
.edge{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:60;touch-action:none}
.form-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 20px var(--pb);border-top:1px solid var(--line);background:var(--bg);transition:padding .3s}
html.kbd .form-foot{padding-bottom:12px}
.ghost{height:46px;border-radius:14px;font-weight:600;color:var(--danger)}
.ghost:active{transform:scale(.97)}
.ghost.confirm{background:rgba(255,90,77,.14)}
#cfBody>.fsec{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*70ms)}
.sidecap{display:flex;align-items:center;gap:8px}
.sidecap i{width:14px;height:3px;border-radius:2px}

/* ---- alt paneller ---- */
.sht{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sht.open{opacity:1;pointer-events:auto}
.sht-card{width:100%;max-height:82%;display:flex;flex-direction:column;background:#101012;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px var(--pb);transform:translateY(100%);transition:transform .45s var(--ease)}
.sht.open .sht-card{transform:none}
.sht h2{font-size:1.3rem;letter-spacing:-.02em}
.sht .ssub{color:var(--dim);font-size:.88rem;line-height:1.4;margin:4px 0 14px}
.sht-list{overflow-y:auto;margin:0 -8px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sht .primary{flex:none;margin-top:8px}
.opt{width:100%;display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;text-align:left}
.opt:active{background:var(--surface2)}
.opt .oi{flex:none;min-width:42px;height:42px;padding:0 6px;border-radius:13px;background:var(--surface2);color:var(--dim);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt.on .oi{background:var(--accent-soft);color:var(--accent)}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:1rem;font-weight:650}
.opt .ot small{display:block;color:var(--dim);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ck{flex:none;width:22px;height:22px;color:var(--accent);opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s var(--ease)}
.opt.on .ck{opacity:1;transform:none}
.opt.bad .ot small{color:var(--amber)}
.dbtns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dbtn{height:56px;border-radius:18px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.dbtn:active{transform:scale(.97)}
.dbtn.no{background:var(--surface2)}
.dbtn.ok{background:var(--accent);color:#fff}
.toast{position:absolute;left:50%;bottom:calc(var(--tbh) + 14px);transform:translate(-50%,20px);background:var(--ink);color:#000;padding:10px 18px;border-radius:20px;font-weight:650;font-size:.9rem;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:50;white-space:nowrap;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Ana kabuk: 4 sayfa (Harita · Kartlar · Omurga · Oyun) + alt sekme çubuğu -->
  <section class="view" id="home">
    <div class="tpages" id="tpages">
      <div class="tpage" role="tabpanel" aria-label="Harita">
        <div class="top"><div class="ttl"><h1>Harita</h1><div class="sub" id="subMap"></div></div>
          <button class="icon-btn acc" data-new aria-label="Yeni kart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="scroll" id="mapBody"></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Kartlar">
        <div class="top"><div class="ttl"><h1>Kartlar</h1><div class="sub" id="subCards"></div></div>
          <button class="icon-btn acc" data-new aria-label="Yeni kart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="scroll" id="cardsBody"></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Omurga">
        <div class="top"><div class="ttl"><h1>Omurga</h1><div class="sub" id="subSpine"></div></div>
          <button class="icon-btn acc" id="addBeatTop" aria-label="Durak ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="scroll" id="spineBody"></div>
      </div>
      <div class="tpage" role="tabpanel" aria-label="Oyun">
        <div class="top"><div class="ttl"><h1>Oyun</h1><div class="sub" id="subGame"></div></div></div>
        <div class="scroll" id="gameBody"></div>
      </div>
    </div>
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sayfalar">
      <i class="tb-ind" id="tbInd"></i>
      <button type="button" class="tb on" role="tab" data-t="0" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M11 8L7 15.6M13 8l4 7.6"/></svg><span>Harita</span></button>
      <button type="button" class="tb" role="tab" data-t="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="3.5" width="11" height="17" rx="3"/><path d="M3 7v10M21 7v10"/></svg><span>Kartlar</span></button>
      <button type="button" class="tb" role="tab" data-t="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 5h12l-3 3.5 3 3.5H6"/></svg><span>Omurga</span></button>
      <button type="button" class="tb" role="tab" data-t="3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg><span>Oyun</span></button>
    </nav>
  </section>

  <!-- Kart düzenleyici: tam ekran sayfa -->
  <section class="view" id="cardForm" aria-label="Kart düzenle">
    <div class="top">
      <button class="icon-btn" id="cfBack" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><h1 id="cfTitle"></h1><div class="sub" id="cfSub"></div></div>
    </div>
    <div class="scroll" id="cfBody"></div>
    <div class="form-foot">
      <button class="primary" id="cfDone">Bitti</button>
      <button class="ghost" id="cfDel">Kartı sil</button>
    </div>
  </section>

  <!-- Sıradaki kartlar seçici -->
  <div class="sht" id="nxSheet">
    <div class="sht-card">
      <h2>Sıradaki kartlar</h2>
      <p class="ssub" id="nxSub"></p>
      <div class="sht-list" id="nxList"></div>
      <button class="primary sec" id="nxDone">Tamam</button>
    </div>
  </div>

  <!-- Onay paneli -->
  <div class="sht" id="dlg">
    <div class="sht-card">
      <h2 id="dlgT"></h2>
      <p class="ssub" id="dlgP"></p>
      <div class="dbtns"><button class="dbtn ok" id="dlgOk"></button><button class="dbtn no" id="dlgNo">Vazgeç</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept=".html,text/html" hidden>
</div>
<script>
var STATS={faith:'İnanç',people:'Halk',army:'Ordu',wealth:'Servet'};
var ARCS={ana:['Ana hikaye','#e0503a'],yan:['Yan görev','#4f86b8'],dal:['Dal','#3f9a7c']};
var KEY='hikaye-masasi-v1';
var $=function(s){return document.querySelector(s)};
var I={
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 20h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'
};
function seed(){
  var T=[['q1','Uğultu',.04,'…uyan… Beni du…yu…yor musun? Gözlerini aç.','Sus','Evet'],['q2','Boğuk bir ses',.15,'Dur. Adını söyle bana.','Hatırlamıyorum','Söylemem'],['q3','Boğuk bir ses',.3,'Dün gece… neredeydin? Düşün.','Hayır','Hatırlıyorum'],['q4','Bir erkek sesi',.5,'Yanındaki adam kimdi? Bana onu anlat.','Tanımıyorum','Anlatırım'],['q5','Bir gölge',.7,'Bir şey saklıyorsun. Gözlerinden belli.','Saklamıyorum','Saklıyorum'],['q6','???',.88,'Bana bak. Şimdi söyle: beni tanıdın mı?','Hayır','Belki'],['q7','???',1,'Işık kısılıyor. Yarın devam ederiz.','…','…']];
  return{cards:T.map(function(t,i){var n=i<6?['q'+(i+2)]:[];return{id:t[0],speaker:t[1],clarity:t[2],text:t[3],arc:'ana',left:{label:t[4],effects:{},next:n},right:Object.assign({label:t[5],effects:{},next:n},t[0]==='q3'?{set:['hatirliyor']}:{})}}),
    ending:'Sabit son: ',beats:[{t:'Uyanış ve sorgu',d:1},{t:'İlk büyük ifşa',d:0},{t:'Dönüm noktası',d:0}]};
}
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cards)S=seed();
S.beats=S.beats||[];S.ending=S.ending||'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mk(t){return esc(t).replace(/==([^=]+)==/g,'<mark class="hl">$1</mark>')}
function plain(t){return String(t==null?'':t).replace(/==/g,'')}
function byId(id){return S.cards.filter(function(c){return c.id===id})[0]}
function nexts(c){return[].concat(c.left&&c.left.next||[],c.right&&c.right.next||[])}
function arcOf(c){return ARCS[c.arc]||ARCS.ana}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1800)}

/* ---------- analiz ---------- */
function analyze(){
  var depth={},q=[],first=S.cards[0],bad={},issues=[];
  if(first){depth[first.id]=0;q.push(first.id)}
  while(q.length){var id=q.shift(),c=byId(id);if(!c)continue;nexts(c).forEach(function(n){if(byId(n)&&depth[n]==null){depth[n]=depth[id]+1;q.push(n)}})}
  S.cards.forEach(function(c){
    if(depth[c.id]==null){bad[c.id]=1;issues.push({id:c.id,m:'Hiçbir yerden ulaşılmıyor'})}
    ['left','right'].forEach(function(d){((c[d]||{}).next||[]).forEach(function(n){if(!byId(n)){bad[c.id]=1;issues.push({id:c.id,m:'"'+n+'" diye bir kart yok'})}})});
    if(!nexts(c).length&&c!==S.cards[S.cards.length-1]){bad[c.id]=1;issues.push({id:c.id,m:'Devamı yok'})}
  });
  return{depth:depth,bad:bad,issues:issues};
}

/* ---------- harita ---------- */
var mapAnim=true;
function renderMap(){
  var A=analyze(),rows=[],un=[],W=Math.max(240,($('#mapBody').clientWidth||innerWidth)-40),H=50,G=46;
  S.cards.forEach(function(c){var d=A.depth[c.id];if(d==null)un.push(c);else(rows[d]=rows[d]||[]).push(c)});
  if(un.length)rows.push(un);
  var pos={},html='',y=0;
  rows.forEach(function(r,ri){
    r=r||[];if(!r.length)return;
    var w=Math.min(158,(W-(r.length-1)*10)/r.length),x0=(W-(r.length*w+(r.length-1)*10))/2;
    r.forEach(function(c,i){pos[c.id]={x:x0+i*(w+10),y:y,w:w};
      html+='<button class="nd'+(A.bad[c.id]?' bad':'')+'" data-open="'+esc(c.id)+'" style="left:'+pos[c.id].x+'px;top:'+y+'px;width:'+w+'px;--ac:'+arcOf(c)[1]+';animation-delay:'+(ri*70+i*40)+'ms"><b>'+esc(c.id)+'</b><span>'+esc(c.speaker||'')+'</span></button>'});
    y+=H+G});
  var svg='';
  S.cards.forEach(function(c){var p=pos[c.id];if(!p)return;
    ['left','right'].forEach(function(d){((c[d]||{}).next||[]).forEach(function(n,k){var t=pos[n];if(!t)return;
      var x1=p.x+p.w*(d==='left'?.3:.7),y1=p.y+H,x2=t.x+t.w/2,y2=t.y,m=(y1+y2)/2;
      svg+='<path pathLength="1" d="M'+x1+' '+y1+'C'+x1+' '+m+' '+x2+' '+m+' '+x2+' '+y2+'" stroke="'+(d==='left'?'#5b9bd5':'#e0503a')+'" style="animation-delay:'+(300+k*60)+'ms"/>'})})});
  var n=A.issues.length,h='';
  h+='<div class="stat in '+(n?'':'ok')+'">'+(n?'<b>'+n+' uyarı</b><span>Aşağıdan karta dokunup düzelt.</span>':'<b>Her şey yolunda</b><span>Her kart ulaşılabilir ve devamı var.</span>')+'</div>';
  if(n){h+='<div class="fsec in" style="--i:1"><div class="fcard">'+A.issues.slice(0,8).map(function(s){return'<button class="frow lnk warnrow" data-open="'+esc(s.id)+'"><span class="fl">'+esc(s.id)+'<small>'+esc(s.m)+'</small></span><span class="chev">'+I.chev+'</span></button>'}).join('')+'</div>'+(n>8?'<div class="fhint">+'+(n-8)+' uyarı daha</div>':'')+'</div>'}
  if(!S.cards.length){h+='<div class="empty"><h2>Henüz kart yok</h2>Sağ üstteki + ile ilk kartı ekle.</div>'}
  else{
    h+='<div class="legend"><span><i style="background:#5b9bd5"></i>Sol seçim</span><span><i style="background:#e0503a"></i>Sağ seçim</span></div>'+
    '<div class="map'+(mapAnim?' anim':'')+'" style="height:'+Math.max(y-G,60)+'px"><svg width="'+W+'" height="'+y+'">'+svg+'</svg>'+html+'</div>';
  }
  $('#mapBody').innerHTML=h;mapAnim=false;
  $('#subMap').textContent=S.cards.length+' kart'+(n?' · '+n+' uyarı':'');
}

/* ---------- kartlar ---------- */
var filt='all';
function renderCards(){
  var A=analyze(),keys=Object.keys(ARCS),list=S.cards.map(function(c,i){return{c:c,i:i}}).filter(function(o){return filt==='all'||(o.c.arc||'ana')===filt});
  var h='<div class="filters"><button class="fl-chip'+(filt==='all'?' on':'')+'" data-f="all">Tümü</button>'+keys.map(function(k){return'<button class="fl-chip'+(filt===k?' on':'')+'" data-f="'+k+'">'+ARCS[k][0]+'</button>'}).join('')+'</div>';
  if(!list.length)h+='<div class="empty"><h2>'+(S.cards.length?'Bu türde kart yok':'Henüz kart yok')+'</h2>Sağ üstteki + düğmesiyle yeni kart ekle.</div>';
  h+=list.map(function(o){var c=o.c,L=c.left||{},R=c.right||{},col=arcOf(c)[1];
    return'<button class="card" data-open="'+esc(c.id)+'"><span class="tile" style="background:'+col+'29;color:'+col+'">'+(o.i+1)+'</span><span class="bd"><span class="name">'+esc(c.id)+' · '+esc(c.speaker||'Konuşan yok')+(A.bad[c.id]?'<i></i>':'')+'</span><p'+(c.text?'':' class="none"')+'>'+(c.text?mk(c.text):'Boş kart')+'</p><span class="chips"><span class="chip l">← '+esc(L.label||'—')+'</span><span class="chip r">'+esc(R.label||'—')+' →</span></span></span></button>'}).join('');
  $('#cardsBody').innerHTML=h;
  $('#subCards').textContent=S.cards.length+' kart';
}

/* ---------- omurga ---------- */
function renderSpine(){
  var seeds=[];S.cards.forEach(function(c){String(c.text).replace(/==([^=]+)==/g,function(_,m){seeds.push([c.id,m])})});
  var done=S.beats.filter(function(b){return b.d}).length;
  $('#spineBody').innerHTML=
   '<div class="fsec"><div class="fcap">Sabit son</div><div class="fcard"><textarea id="end" class="finput" placeholder="Hikayenin değişmeyen sonu, tek paragraf…">'+esc(S.ending)+'</textarea></div></div>'+
   '<div class="fsec"><div class="fcap">Ana duraklar</div><div class="fcard">'+
    S.beats.map(function(b,i){return'<div class="frow beat'+(b.d?' done':'')+'"><button class="sw-ck" data-bt="'+i+'" aria-label="Tamamlandı">'+I.check+'</button><input data-bi="'+i+'" value="'+esc(b.t)+'" placeholder="Durak adı" enterkeyhint="done" autocomplete="off"><button class="x" data-bd="'+i+'" aria-label="Sil">'+I.x+'</button></div>'}).join('')+
    '<button class="frow lnk" id="addBeat"><span class="fl" style="color:var(--accent)">Durak ekle</span></button></div>'+
    '<div class="fhint">Hangi yoldan gidilirse gidilsin herkesin geçeceği kırılma noktaları.</div></div>'+
   '<div class="fsec"><div class="fcap">Tohumlar</div><div class="fcard">'+
    (seeds.length?seeds.map(function(s){return'<button class="frow lnk" data-open="'+esc(s[0])+'"><span class="fl"><mark class="hl seedtxt">'+esc(s[1])+'</mark><small>'+esc(s[0])+' kartında</small></span><span class="chev">'+I.chev+'</span></button>'}).join(''):'<div class="frow"><span class="fl" style="color:var(--dim);font-weight:500">Henüz tohum yok</span></div>')+
    '</div><div class="fhint">Kart metninde bir ifadeyi işaretlersen buraya düşer. Sonda karşılığını vereceğin ipuçları.</div></div>';
  $('#subSpine').textContent=S.beats.length?done+'/'+S.beats.length+' durak':'Durak yok';
}

/* ---------- oyun dosyası ---------- */
function renderGame(){
  function row(a,t,s,ic){return'<button class="frow lnk lead" data-io="'+a+'"><span class="in-ic">'+ic+'</span><span class="fl">'+t+'<small>'+s+'</small></span><span class="chev">'+I.chev+'</span></button>'}
  $('#gameBody').innerHTML='<div class="fsec"><div class="fcap">Oyun dosyası</div><div class="fcard">'+
    row('in','Kartları oyundan al','Oyunun index.html dosyasından içeri alır',I.down)+
    row('out','Oyuna işle ve indir','Yalnızca kart bölümü değişir; kod bozulmaz',I.up)+
    row('copy','Kart kodunu kopyala','Elle yapıştırmak istersen',I.copy)+
    '</div><div class="fhint">Önce oyunun index.html dosyasını seçersin. Çizimler ve oyun kodu olduğu gibi kalır, sadece kart bölümü güncellenir.</div></div>';
  $('#subGame').textContent=S.cards.length+' kart hazır';
}
function refresh(){renderMap();renderCards();renderSpine();renderGame()}

/* ---------- alt paneller ---------- */
function sheetOpen(id){$(id).classList.add('open')}
function sheetClose(id){$(id).classList.remove('open')}
var dlgCb=null;
function ask(t,p,ok,cb){$('#dlgT').textContent=t;$('#dlgP').textContent=p;$('#dlgOk').textContent=ok;dlgCb=cb;sheetOpen('#dlg')}
$('#dlgOk').onclick=function(){sheetClose('#dlg');var f=dlgCb;dlgCb=null;if(f)f()};
$('#dlgNo').onclick=function(){sheetClose('#dlg');dlgCb=null};
$('#dlg').addEventListener('click',function(e){if(e.target===this)$('#dlgNo').onclick()});

/* ---------- kart düzenleyici ---------- */
var cur=null,formOpen=false,pushed=false,nxSide='left';
function sideSec(d,k){
  var o=cur[d]||(cur[d]={label:'',effects:{},next:[]}),e=o.effects||{};
  var cap=d==='left'?'<span class="sidecap"><i style="background:#5b9bd5"></i>Sola kaydırınca</span>':'<span class="sidecap"><i style="background:#e0503a"></i>Sağa kaydırınca</span>';
  return'<div class="fsec" style="--k:'+k+'"><div class="fcap">'+cap+'</div><div class="fcard">'+
   '<div class="fcell"><small>Seçim etiketi</small><input class="finput" data-p="'+d+'.label" value="'+esc(o.label)+'" placeholder="Örn. Evet" enterkeyhint="done" autocomplete="off"></div>'+
   Object.keys(STATS).map(function(s){return'<div class="frow"><span class="fl">'+STATS[s]+'</span>'+stepHTML(d,s,e[s]||0)+'</div>'}).join('')+
   '<div class="fcell"><small>Bayrak koy (virgülle ayır)</small><input class="finput" data-l="'+d+'.set" value="'+esc((o.set||[]).join(', '))+'" placeholder="hatirliyor" enterkeyhint="done" autocomplete="off" autocapitalize="none"></div>'+
   '<button class="frow lnk" data-nx="'+d+'"><span class="fl">Sıradaki kartlar<small></small></span><span class="chev">'+I.chev+'</span></button>'+
   '</div></div>';
}
function stepHTML(d,s,v){return'<div class="stepper" data-e="'+d+'.'+s+'"><button type="button" data-d="-5" aria-label="Azalt">−</button><div class="val">'+valHTML(v)+'</div><button type="button" data-d="5" aria-label="Arttır">+</button></div>'}
function valHTML(v){return'<b class="'+(v>0?'p':v<0?'n':'z')+'">'+(v>0?'+':'')+v+'</b>'}
function updNx(d){
  var b=$('#cfBody [data-nx="'+d+'"]');if(!b)return;
  var n=(cur[d]||{}).next||[],bad=n.filter(function(x){return!byId(x)}).length,s=b.querySelector('small');
  s.textContent=n.length?n.join(', ')+(bad?' · '+bad+' kart yok':''):'Seçilmedi';
  b.classList.toggle('warnrow',!!bad);
}
function openForm(id){
  if(formOpen)return;cur=byId(id);if(!cur)return;
  formOpen=true;
  var keys=Object.keys(ARCS),ai=Math.max(0,keys.indexOf(cur.arc||'ana'));
  $('#cfTitle').textContent=cur.id;$('#cfSub').textContent=cur.speaker||'Konuşan yok';
  $('#cfBody').innerHTML=
   '<div class="fsec" style="--k:0"><div class="fcap">Kart</div><div class="fcard">'+
    '<div class="frow seg-row"><div class="seg" id="arcSeg" style="--n:3;--k:'+ai+'"><i></i>'+keys.map(function(k){return'<button type="button" data-arc="'+k+'" class="'+(k===(cur.arc||'ana')?'on':'')+'">'+ARCS[k][0]+'</button>'}).join('')+'</div></div>'+
    '<div class="fcell"><small>Konuşan</small><input class="finput" data-p="speaker" value="'+esc(cur.speaker)+'" placeholder="Örn. Boğuk bir ses" enterkeyhint="done" autocomplete="off"></div>'+
   '</div></div>'+
   '<div class="fsec" style="--k:1"><div class="fcap">Metin</div><div class="fcard">'+
    '<textarea id="txt" class="finput" data-p="text" placeholder="Kartın metni…">'+esc(cur.text)+'</textarea>'+
    '<button type="button" class="frow lnk lead" id="mkBtn"><span class="in-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h5l10-10-5-5L4 15z"/><path d="M12.5 6.5l5 5"/></svg></span><span class="fl">Seçili ifadeyi işaretle<small>Metinde bir ifade seç, sonra dokun</small></span></button>'+
    '<div class="prevbox"><small>Önizleme</small><div class="prev" id="prev">'+mk(cur.text)+'</div></div>'+
   '</div></div>'+
   sideSec('left',2)+sideSec('right',3);
  updNx('left');updNx('right');
  var f=$('#cardForm');f.inert=false;$('#home').inert=true;
  $('#cfBody').scrollTop=0;resetDel();
  f.classList.add('open');
  try{history.pushState({f:1},'');pushed=true}catch(e){pushed=false}
}
function doClose(){
  if(!formOpen)return;formOpen=false;
  $('#cardForm').classList.remove('open');sheetClose('#nxSheet');
  var a=document.activeElement;if(a&&a.blur)a.blur();
  $('#home').inert=false;cur=null;
  setTimeout(function(){if(!formOpen)$('#cardForm').inert=true},450);
  refresh();
}
function closeForm(){
  if(!formOpen)return;
  var p=pushed;pushed=false;doClose();
  if(p){try{history.back()}catch(e){}}
}
window.addEventListener('popstate',function(){if(formOpen){pushed=false;doClose()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('#nxSheet').classList.contains('open'))sheetClose('#nxSheet');else if($('#dlg').classList.contains('open'))$('#dlgNo').onclick();else closeForm()}});
$('#cfBack').onclick=closeForm;$('#cfDone').onclick=closeForm;

/* silme: iki dokunuşla */
var delT=0;
function resetDel(){clearTimeout(delT);var b=$('#cfDel');b.classList.remove('confirm');b.textContent='Kartı sil'}
$('#cfDel').onclick=function(){
  var b=this;
  if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='Silmek için tekrar dokun';delT=setTimeout(resetDel,3000);return}
  var c=cur;resetDel();S.cards=S.cards.filter(function(x){return x!==c});save();closeForm();toast('Kart silindi');
};

/* sıradaki kartlar seçici */
function openNext(d){
  nxSide=d;var sel=cur[d].next||(cur[d].next=[]);
  $('#nxSub').textContent=(d==='left'?'Sola':'Sağa')+' kaydırınca hangi karta geçilsin?';
  var bad=sel.filter(function(n){return!byId(n)}),others=S.cards.filter(function(c){return c!==cur});
  $('#nxList').innerHTML=bad.map(function(n){return'<button class="opt on bad" data-pick="'+esc(n)+'"><span class="oi">?</span><span class="ot"><b>'+esc(n)+'</b><small>Bu kart yok · kaldırmak için dokun</small></span><span class="ck">'+I.check+'</span></button>'}).join('')+
   (others.length?others.map(function(c){return'<button class="opt'+(sel.indexOf(c.id)>-1?' on':'')+'" data-pick="'+esc(c.id)+'"><span class="oi">'+esc(c.id)+'</span><span class="ot"><b>'+esc(c.speaker||'Konuşan yok')+'</b><small>'+esc(plain(c.text)||'Boş kart')+'</small></span><span class="ck">'+I.check+'</span></button>'}).join(''):'<p class="ssub">Başka kart yok. Önce yeni bir kart ekle.</p>');
  sheetOpen('#nxSheet');
}
$('#nxDone').onclick=function(){sheetClose('#nxSheet')};
$('#nxSheet').addEventListener('click',function(e){
  if(e.target===this)return sheetClose('#nxSheet');
  var t=e.target.closest('[data-pick]');if(!t||!cur)return;
  var id=t.dataset.pick,a=cur[nxSide].next||(cur[nxSide].next=[]),i=a.indexOf(id);
  if(i>-1){a.splice(i,1);if(t.classList.contains('bad'))t.remove();else t.classList.remove('on')}else{a.push(id);t.classList.add('on')}
  save();updNx(nxSide);
});

function setPath(p,v){var k=p.split('.'),o=cur;while(k.length>1){var n=k.shift();o=o[n]=o[n]||{}}o[k[0]]=v;save()}
function list(v){return v.split(',').map(function(x){return x.trim()}).filter(Boolean)}

$('#cfBody').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||!cur)return;
  if(t.dataset.arc){var keys=Object.keys(ARCS);cur.arc=t.dataset.arc;save();var sg=$('#arcSeg');sg.style.setProperty('--k',keys.indexOf(t.dataset.arc));[].forEach.call(sg.querySelectorAll('button'),function(b){b.classList.toggle('on',b===t)});return}
  if(t.dataset.d&&t.parentNode.dataset.e){
    var p=t.parentNode.dataset.e.split('.'),o=cur[p[0]].effects=cur[p[0]].effects||{},v=Math.max(-50,Math.min(50,(o[p[1]]||0)+ +t.dataset.d));
    if(v)o[p[1]]=v;else delete o[p[1]];save();t.parentNode.querySelector('.val').innerHTML=valHTML(v);return}
  if(t.dataset.nx)return openNext(t.dataset.nx);
  if(t.id==='mkBtn'){var x=$('#txt'),a=x.selectionStart,b=x.selectionEnd;if(a===b)return toast('Önce metinde bir ifade seç');
    x.value=x.value.slice(0,a)+'=='+x.value.slice(a,b)+'=='+x.value.slice(b);cur.text=x.value;save();$('#prev').innerHTML=mk(cur.text)}
});
$('#cfBody').addEventListener('pointerdown',function(e){if(e.target.closest('#mkBtn'))e.preventDefault()});
$('#cfBody').addEventListener('input',function(e){
  var t=e.target;if(!cur)return;
  if(t.dataset.p){setPath(t.dataset.p,t.value);
    if(t.dataset.p==='text')$('#prev').innerHTML=mk(t.value);
    if(t.dataset.p==='speaker')$('#cfSub').textContent=t.value||'Konuşan yok'}
  if(t.dataset.l){setPath(t.dataset.l,list(t.value))}
});

/* ---------- yeni kart ---------- */
function newCard(){
  var n=S.cards.length+1,id='k'+n;while(byId(id))id='k'+(++n);
  S.cards.push({id:id,speaker:'',text:'',arc:'ana',left:{label:'',effects:{},next:[]},right:{label:'',effects:{},next:[]}});
  save();refresh();openForm(id);
}

/* ---------- oyun dosyası ---------- */
var ioMode='';
function code(){return'/* CARDS:BEGIN */\nwindow.CARDS = '+JSON.stringify(S.cards,null,2)+';\n/* CARDS:END */'}
function between(h){var b=h.indexOf('/* CARDS:BEGIN */'),e=h.indexOf('/* CARDS:END */');
  if(b>-1&&e>b)return[b,e+'/* CARDS:END */'.length];
  b=h.indexOf('window.CARDS = [');e=h.indexOf('\n];',b);return b>-1&&e>b?[b,e+3]:null}
$('#file').addEventListener('change',function(ev){
  var f=ev.target.files[0];ev.target.value='';if(!f)return;
  var r=new FileReader();r.onload=function(){
    var h=String(r.result),rg=between(h);if(!rg)return toast('Dosyada kart bölümü bulunamadı');
    if(ioMode==='in'){
      try{var t=h.slice(rg[0],rg[1]).replace('/* CARDS:BEGIN */','').replace('/* CARDS:END */','').replace('window.CARDS =','').trim().replace(/;$/,'');
        var cs=new Function('return '+t)();cs.forEach(function(c){c.arc=c.arc||'ana'});S.cards=cs;save();refresh();toast(cs.length+' kart alındı')}catch(e){toast('Kartlar okunamadı')}
    }else{
      var out=h.slice(0,rg[0])+code()+h.slice(rg[1]),a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('Güncel dosya indirildi')}
  };r.readAsText(f)});
function doIO(m){
  ioMode=m;
  if(m==='copy'){(navigator.clipboard?navigator.clipboard.writeText(code()):Promise.reject()).then(function(){toast('Kopyalandı')},function(){toast('Kopyalanamadı')});return}
  if(m==='in')return ask('Kartların yerine geçsin mi?','Oyundan alınan kartlar şu anki '+S.cards.length+' kartın yerini alır. Önce "Oyuna işle" ile yedek alabilirsin.','Devam et',function(){$('#file').click()});
  $('#file').click();
}

/* ---------- genel tıklamalar ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.open!=null)return openForm(t.dataset.open);
  if(t.hasAttribute('data-new'))return newCard();
  if(t.dataset.io)return doIO(t.dataset.io);
  if(t.dataset.f){filt=t.dataset.f;return renderCards()}
  if(t.id==='addBeat'||t.id==='addBeatTop'){S.beats.push({t:'',d:0});save();renderSpine();if(t.id==='addBeatTop')tabGo(2);
    setTimeout(function(){var i=document.querySelectorAll('#spineBody .beat input');if(i.length)i[i.length-1].focus()},60);return}
  if(t.dataset.bt!=null){var b=S.beats[+t.dataset.bt];b.d=b.d?0:1;save();t.parentNode.classList.toggle('done',!!b.d);
    var dn=S.beats.filter(function(x){return x.d}).length;$('#subSpine').textContent=dn+'/'+S.beats.length+' durak';return}
  if(t.dataset.bd!=null){S.beats.splice(+t.dataset.bd,1);save();renderSpine()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='end'){S.ending=t.value;save();return}
  if(t.dataset.bi!=null){S.beats[+t.dataset.bi].t=t.value;save()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.blur()});

/* ---------- sekmeler ---------- */
var EASE='cubic-bezier(.32,.72,0,1)',N=4;
var tpages=$('#tpages'),tbInd=$('#tbInd'),tabs=document.querySelectorAll('#tabbar .tb'),pages=tpages.children,tabIdx=0,tabAnim=null;
function tabPct(i){return -i*100/N}
function tabPaint(i,anim){
  [].forEach.call(tabs,function(b,k){b.classList.toggle('on',k===i);b.setAttribute('aria-selected',k===i)});
  var w=tabs[0].offsetWidth,x=w*i,f=tbInd._x==null?x:tbInd._x;
  if(anim)tbInd.animate([{transform:'translateX('+f+'px)'},{transform:'translateX('+x+'px)'}],{duration:480,easing:EASE});
  tbInd.style.transform='translateX('+x+'px)';tbInd._x=x;
}
function tabGo(i,instant){
  if(i===tabIdx&&!instant)return;
  var from=tabIdx;if(tabAnim){tabAnim.cancel();tabAnim=null}
  tabIdx=i;tabPaint(i,!instant);pages[i].inert=false;
  tpages.style.transform='translate3d('+tabPct(i)+'%,0,0)';
  function settle(){for(var k=0;k<pages.length;k++)if(k!==tabIdx)pages[k].inert=true}
  if(instant){settle();return}
  tabAnim=tpages.animate([{transform:'translate3d('+tabPct(from)+'%,0,0)'},{transform:'translate3d('+tabPct(i)+'%,0,0)'}],{duration:480,easing:EASE});
  tabAnim.onfinish=function(){tabAnim=null;settle()};
  pages[i].animate([{opacity:.15},{opacity:1}],{duration:480,easing:EASE});
  pages[from].animate([{opacity:1},{opacity:.15}],{duration:480,easing:EASE});
  if(i===0)renderMap();
}
[].forEach.call(tabs,function(b){b.onclick=function(){tabGo(+b.dataset.t)}});
window.addEventListener('resize',function(){tbInd._x=null;tabPaint(tabIdx,false);renderMap()});
/* yatay kaydırarak sekme değiştir */
(function(){
  var sx,sy,st,on=false;
  tpages.addEventListener('touchstart',function(e){
    on=e.touches.length===1&&!formOpen&&!e.target.closest('input,textarea,.filters,.map')&&e.touches[0].clientX>24;
    if(on){sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()}
  },{passive:true});
  tpages.addEventListener('touchend',function(e){
    if(!on)return;on=false;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,v=Math.abs(dx)/Math.max(1,Date.now()-st);
    if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.7||(Math.abs(dx)<90&&v<.35))return;
    tabGo(Math.max(0,Math.min(N-1,tabIdx+(dx<0?1:-1))));
  },{passive:true});
})();
/* soldan çekerek geri */
(function(){
  var f=$('#cardForm'),strip=document.createElement('div');strip.className='edge';f.appendChild(strip);
  var sx=null,dx=0,t0=0,W=1;
  strip.addEventListener('touchstart',function(e){if(!formOpen||sx!=null)return;sx=e.touches[0].clientX;dx=0;t0=Date.now();W=f.offsetWidth||innerWidth;f.classList.add('drag')},{passive:true});
  strip.addEventListener('touchmove',function(e){if(sx==null)return;dx=Math.min(W,Math.max(0,e.touches[0].clientX-sx));f.style.transform='translate3d('+dx+'px,0,0)'},{passive:true});
  function end(cancel){if(sx==null)return;var v=dx/Math.max(1,Date.now()-t0),go=!cancel&&(dx>W*.33||v>.6);sx=null;dx=0;f.classList.remove('drag');f.style.transform='';if(go)closeForm()}
  strip.addEventListener('touchend',function(){end(false)});strip.addEventListener('touchcancel',function(){end(true)});
})();

/* ---------- ekran yüksekliği / klavye ---------- */
(function(){
  var root=document.documentElement,stage=$('#stage'),maxH=0;
  var standalone=!root.classList.contains('browser');
  function fit(){
    var hh=Math.max(innerHeight,root.clientHeight);
    if(standalone){var pt=innerHeight>=innerWidth;hh=Math.max(hh,pt?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width))}else hh=innerHeight;
    var ae=document.activeElement,vv=window.visualViewport,typing=false;
    if(vv&&ae&&ae.matches&&ae.matches('input,textarea')&&vv.height<hh-80){typing=true;hh=Math.round(vv.height+vv.offsetTop)}
    root.style.setProperty('--full-h',hh+'px');root.classList.toggle('kbd',typing);
  }
  function unstick(){
    maxH=Math.max(maxH,innerHeight);
    if(maxH-innerHeight>4){var keep=[].map.call(document.querySelectorAll('.scroll'),function(e){return[e,e.scrollTop]});
      stage.style.display='none';void stage.offsetHeight;stage.style.display='';keep.forEach(function(k){k[0].scrollTop=k[1]})}
    fit();
  }
  function caretIntoView(){
    var a=document.activeElement;if(!a||!a.matches||!a.matches('input,textarea'))return;
    var sc=a.closest('.scroll');if(!sc)return;
    var r=a.getBoundingClientRect(),c=sc.getBoundingClientRect();
    if(r.bottom>c.bottom-24)sc.scrollTop+=r.bottom-c.bottom+24;else if(r.top<c.top+16)sc.scrollTop-=c.top+16-r.top;
  }
  window.addEventListener('scroll',function(){window.scrollTo(0,0)});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',function(){fit();setTimeout(caretIntoView,340)});
    visualViewport.addEventListener('scroll',function(){fit();window.scrollTo(0,0)});
  }
  document.addEventListener('focusin',function(){[50,250,500].forEach(function(t){setTimeout(function(){fit();caretIntoView()},t)})});
  document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(!a||!a.matches||!a.matches('input,textarea'))unstick()},80)});
  window.addEventListener('orientationchange',function(){setTimeout(unstick,300)});
  window.addEventListener('resize',fit);
  fit();requestAnimationFrame(function(){root.classList.add('ready')});
})();

$('#cardForm').inert=true;
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
refresh();tabGo(0,true);tabPaint(0,false);
</script>
